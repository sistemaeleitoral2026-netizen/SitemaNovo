document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

head panel-pad\"><div><h2>Últimos lançamentos<\u002Fh2><div class=\"sub\">Parceiro, centro de custo e recebimento<\u002Fdiv><\u002Fdiv><button class=\"section-link\" data-goto=\"financeiro\">Ver todos<\u002Fbutton><\u002Fdiv><div class=\"table-wrap\" id=\"dash-fin-table\"><\u002Fdiv><\u002Fdiv><div class=\"panel\"><div class=\"section-head panel-pad\"><div><h2>Últimas tarefas<\u002Fh2><div class=\"sub\">Acompanhamento de execução<\u002Fdiv><\u002Fdiv><button class=\"section-link\" data-goto=\"demandas\">Ver tarefas<\u002Fbutton><\u002Fdiv><div id=\"dash-task-table\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"page-financeiro\" class=\"page-section\" data-screen-label=\"Lançamentos\"><div class=\"heading\"><div><h1>Lançamentos financeiros<\u002Fh1><p>Previsto, recebido e saídas por empresa e centro de custo, com comprovantes vinculados.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn\" id=\"csv-export\"><svg><use href=\"#i-dl\"><\u002Fuse><\u002Fsvg>Exportar CSV<\u002Fbutton><button class=\"btn primary\" data-open=\"finance\"><svg><use href=\"#i-plus\"><\u002Fuse><\u002Fsvg>Novo lançamento<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div class=\"context\"><div class=\"ctx-row\"><span class=\"ctx-label\">Empresa<\u002Fspan><div id=\"company-picker-financeiro\"><\u002Fdiv><\u002Fdiv><div id=\"filter-financeiro\"><\u002Fdiv><\u002Fdiv>\n<div class=\"metric-grid\" id=\"finance-metrics\"><\u002Fdiv><div class=\"section panel\"><div class=\"section-head panel-pad\"><div><h2>Lançamentos do período<\u002Fh2><div class=\"sub\" id=\"finance-count\"><\u002Fdiv><\u002Fdiv><button class=\"section-link\" data-goto=\"historico\">Histórico completo<\u002Fbutton><\u002Fdiv><div class=\"table-wrap\" id=\"finance-table\"><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"page-historico\" class=\"page-section\" data-screen-label=\"Histórico financeiro\"><div class=\"heading\"><div><h1>Histórico financeiro<\u002Fh1><p>Todos os lançamentos do controle financeiro, filtráveis por empresa, mês e centro de custo.<\u002Fp><\u002Fdiv><button class=\"btn\" data-goto=\"financeiro\">Voltar aos lançamentos<\u002Fbutton><\u002Fdiv><div class=\"filters\" id=\"fin-history-filters\"><\u002Fdiv><div id=\"fin-history-summary\" class=\"history-summary\"><\u002Fdiv><div class=\"panel\"><div class=\"section-head panel-pad\"><div><h2>Movimentações financeiras<\u002Fh2><div class=\"sub\">Parceiro, centro de custo, previsto, recebido e saída<\u002Fdiv><\u002Fdiv><span class=\"muted\" id=\"fin-history-count\"><\u002Fspan><\u002Fdiv><div class=\"table-wrap\" id=\"fin-history-table\"><\u002Fdiv><div id=\"fin-history-pager\" class=\"history-pager\"><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"page-tarefas-historico\" class=\"page-section\" data-screen-label=\"Prestação de contas\"><div class=\"heading\"><div><h1>Prestação de contas<\u002Fh1><p>Registros mensais da planilha de despesas e tarefas executadas no sistema. Independente do controle financeiro.<\u002Fp><\u002Fdiv><button class=\"btn\" data-goto=\"demandas\">Ver tarefas<\u002Fbutton><\u002Fdiv><div class=\"panel\"><div class=\"section-head panel-pad\"><div><h2>Planilha histórica por mês<\u002Fh2><div class=\"sub\">Registros originais de março a outubro, com nomes, descrições, bancos e situações<\u002Fdiv><\u002Fdiv><span class=\"muted\" id=\"history-count\"><\u002Fspan><\u002Fdiv><div class=\"filters\" id=\"history-filters\"><\u002Fdiv><div id=\"history-summary\" class=\"history-summary\"><\u002Fdiv><div class=\"table-wrap\" id=\"history-table\"><\u002Fdiv><div id=\"history-pager\" class=\"history-pager\"><\u002Fdiv><\u002Fdiv><div class=\"section panel\"><div class=\"section-head panel-pad\"><div><h2>Tarefas atribuídas e executadas no sistema<\u002Fh2><div class=\"sub\">Prazos, responsáveis e andamento cadastrados<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"filters\" id=\"tasks-history-filters\"><\u002Fdiv><div class=\"table-wrap\" id=\"tasks-history-table\"><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"page-demandas\" class=\"page-section\" data-screen-label=\"Demandas e tarefas\"><div class=\"heading\"><div><h1>Demandas e tarefas<\u002Fh1><p>Atribua atividades a um responsável e acompanhe prazos, execução e comprovantes.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn primary\" data-open=\"task\"><svg><use href=\"#i-plus\"><\u002Fuse><\u002Fsvg>Nova tarefa<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"info-strip\">Pagamentos e comprovantes registrados em uma tarefa não geram lançamento financeiro automaticamente.<\u002Fdiv><div class=\"section panel\"><div class=\"section-head panel-pad\"><h2>Tarefas cadastradas<\u002Fh2><span class=\"muted\" id=\"task-count\"><\u002Fspan><\u002Fdiv><div class=\"filters\" id=\"task-filters\"><\u002Fdiv><div class=\"table-wrap\" id=\"task-table\"><\u002Fdiv><div class=\"panel-pad\" style=\"border-top:1px solid var(--line)\"><button class=\"section-link\" data-goto=\"tarefas-historico\">Ver prestação de contas<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"page-minhas\" class=\"page-section\" data-screen-label=\"Minhas tarefas\"><div class=\"heading\"><div><h1>Minhas tarefas<\u002Fh1><p>Atividades atribuídas a você, ordenadas pelo prazo.<\u002Fp><\u002Fdiv><div class=\"actions\"><button class=\"btn primary\" data-open=\"task\"><svg><use href=\"#i-plus\"><\u002Fuse><\u002Fsvg>Nova tarefa<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"panel table-wrap\"><div id=\"my-task-table\"><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"page-anexos\" class=\"page-section\" data-screen-label=\"Comprovantes\"><div class=\"heading\"><div><h1>Comprovantes<\u002Fh1><p>Anexos vinculados aos lançamentos e às tarefas.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"info-strip\">Os arquivos anexados ficam salvos neste navegador e podem ser visualizados aqui. Em produção, ficarão em armazenamento privado vinculado ao registro.<\u002Fdiv><div class=\"panel table-wrap\" id=\"attachment-list\"><\u002Fdiv><\u002Fsection>\n<section id=\"page-auditoria\" class=\"page-section\" data-screen-label=\"Auditoria\"><div class=\"heading\"><div><h1>Auditoria<\u002Fh1><p>Rastro de criação e alteração de lançamentos, tarefas e cadastros.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"info-strip\">A identificação do usuário é demonstrativa. Auditoria definitiva exige usuário autenticado e registro no servidor.<\u002Fdiv><div class=\"panel table-wrap\" id=\"audit-table\"><\u002Fdiv><\u002Fsection>\n<section id=\"page-configuracoes\" class=\"page-section\" data-screen-label=\"Configurações\"><div class=\"heading\"><div><h1>Configurações<\u002Fh1><p>Cadastros que alimentam os formulários de lançamentos e tarefas, e gestão dos dados deste ambiente.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"settings-layout\"><nav class=\"settings-nav\" aria-label=\"Seções de configurações\"><div class=\"sn-label\">Cadastros<\u002Fdiv><button type=\"button\" class=\"sn-btn active\" data-set=\"centers\"><svg><use href=\"#i-layers\"><\u002Fuse><\u002Fsvg><span class=\"sn-text\">Centros de custo<small>Códigos M1 a M5<\u002Fsmall><\u002Fspan><span class=\"sn-count\" id=\"snc-centers\"><\u002Fspan><\u002Fbutton><button type=\"button\" class=\"sn-btn\" data-set=\"banks\"><svg><use href=\"#i-bank\"><\u002Fuse><\u002Fsvg><span class=\"sn-text\">Contas e origens<small>Origem do pagamento<\u002Fsmall><\u002Fspan><span class=\"sn-count\" id=\"snc-banks\"><\u002Fspan><\u002Fbutton><button type=\"button\" class=\"sn-btn\" data-set=\"templates\"><svg><use href=\"#i-copy\"><\u002Fuse><\u002Fsvg><span class=\"sn-text\">Modelos de tarefas<small>Títulos sugeridos<\u002Fsmall><\u002Fspan><span class=\"sn-count\" id=\"snc-templates\"><\u002Fspan><\u002Fbutton><button type=\"button\" class=\"sn-btn\" data-set=\"staff\"><svg><use href=\"#i-users\"><\u002Fuse><\u002Fsvg><span class=\"sn-text\">Equipe<small>Responsáveis<\u002Fsmall><\u002Fspan><span class=\"sn-count\" id=\"snc-staff\"><\u002Fspan><\u002Fbutton>< stopPropagation();openViewer(v.dataset.viewFiles,Number(v.dataset.fileIndex||0));return}const vi=e.target.closest('[data-viewer-index]');if(vi)showFile(Number(vi.dataset.viewerIndex))},true);\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});\n/* Settings */\nconst SET={tab:'centers',edit:false,draft:null};\nconst SETDEF={centers:{title:'Centros de custo',desc:'Os códigos M1 a M5 identificam o centro de custo em cada lançamento. A descrição aparece junto ao código no formulário de lançamento.'},banks:{title:'Contas e origens de pagamento',desc:'Opções do campo “Origem do pagamento” nas tarefas e prestações de contas.',key:'banks',item:'origem',usage:v=>db.tasks.filter(t=>t.origemPagamento===v).length},templates:{title:'Modelos de tarefas',desc:'Títulos sugeridos ao cadastrar uma nova tarefa. O cadastro continua aceitando tarefa livre.',key:'templates',item:'modelo',usage:v=>db.tasks.filter(t=>t.titulo===v).length},staff:{title:'Equipe administrativa',desc:'Pessoas sugeridas no campo “Responsável” das tarefas.',key:'staff',item:'pessoa',usage:v=>db.tasks.filter(t=>t.responsavel===v).length},companies:{title:'Empresas',desc:'Empresas do módulo financeiro (Demanda J). A lista é definida pelo sistema; empresas da Demanda D ainda não foram informadas.'}};\nconst setOriginal=()=>SET.tab==='centers'?Object.fromEntries(COST_CODES.map(c=>[c,db.centers[c]||''])):[...db[SETDEF[SET.tab].key]];\nconst setClean=d=>SET.tab==='centers'?Object.fromEntries(COST_CODES.map(c=>[c,String(d[c]||'').trim()])):[...new Set(d.map(s=>String(s).trim()).filter(Boolean))];\nconst setDirty=()=>SET.edit&&JSON.stringify(setClean(SET.draft))!==JSON.stringify(setClean(setOriginal()));\nfunction updateDirty(){const on=setDirty();const ind=$('#dirty-ind'),btn=$('#set-save');if(ind){ind.classList.toggle('on',on);ind.textContent=on?'Alterações não salvas':'Nenhuma alteração'}if(btn)btn.disabled=!on;if(SET.tab!=='centers'){const seen={};$$('.edit-row input[data-i]').forEach(inp=>{const v=inp.value.trim().toLowerCase();inp.classList.toggle('dup',!!v&&!!seen[v]);if(v)seen[v]=1})}}\nfunction drawSettings(){const c={centers:COST_CODES.filter(k=>db.centers[k]).length+'/'+COST_CODES.length,banks:db.banks.length,templates:db.templates.length,staff:db.staff.length,companies:subdivisions.length};for(const k in c){const el=$('#snc-'+k);if(el)el.textContent=c[k]}$$('.sn-btn').forEach(b=>b.classList.toggle('active',b.dataset.set===SET.tab));$('#set-env').classList.toggle('hide',SET.tab!=='env');$('#set-dynamic').classList.toggle('hide',SET.tab==='env');if(SET.tab==='env'){const files=[...db.finance,...db.tasks,...Object.values(db.historyEdits)].reduce((n,r)=>n+((r&&r.anexos)||[]).length,0);$('#env-stats').innerHTML=[['Lançamentos',db.finance.length],['Tarefas',db.tasks.length],['Edições na planilha',Object.keys(db.historyEdits).length],['Comprovantes',files],['Registros de auditoria',db.audit.length]].map(x=>`<div><span>${x[0]}<\u002Fspan><strong>${x[1].toLocaleString('pt-BR')}<\u002Fstrong><\u002Fdiv>`).join('');return}const def=SETDEF[SET.tab];let body='',foot='',head='';\nif(SET.tab==='companies'){body=`<table class=\"set-table\"><thead><tr><th>Empresa<\u002Fth><th>Lançamentos<\u002Fth><th>Previsto<\u002Fth><th>Recebido<\u002Fth><\u002Ftr><\u002Fthead><tbody>${subdivisions.map(s=>{const rr=db.finance.filter(r=>r.sub===s),t=totals(rr);return `<tr><td><b>${esc(s)}<\u002Fb><\u002Ftd><td class=\"amount\">${rr.length}<\u002Ftd><td class=\"amount\">${fmt(t.prev)}<\u002Ftd><td class=\"amount\">${fmt(t.rec)}<\u002Ftd><\u002Ftr>`}).join('')}<\u002Ftbody><\u002Ftable>`;head=`<button type=\"button\" class=\"btn\" data-goto=\"financeiro\">${icon('wallet')}Abrir lançamentos<\u002Fbutton>`}\nelse if(!SET.edit){head=`<button type=\"button\" class=\"btn\" data-set-act=\"edit\">${icon('edit')}Editar<\u002Fbutton>`;if(SET.tab==='centers'){body=`<table class=\"set-table\"><thead><tr><th>Código<\u002Fth><th>Descrição<\u002Fth><th>Lançamentos<\u002Fth><\u002Ftr><\u002Ft ><\u002Fdiv>`}foot=`<div class=\"set-foot\"><span class=\"dirty-ind\" id=\"dirty-ind\">Nenhuma alteração<\u002Fspan><button type=\"button\" class=\"btn\" data-set-act=\"cancel\">Cancelar<\u002Fbutton><button type=\"button\" class=\"btn primary\" data-set-act=\"save\" id=\"set-save\" disabled>${icon('check')}Salvar alterações<\u002Fbutton><\u002Fdiv>`;head=`<span class=\"pill info\">Modo de edição<\u002Fspan>`}\n$('#set-dynamic').innerHTML=`<div class=\"set-card\"><div class=\"set-head\"><div><h2>${def.title}<\u002Fh2><p>${def.desc}<\u002Fp><\u002Fdiv><div class=\"actions\">${head}<\u002Fdiv><\u002Fdiv><div class=\"set-body\">${body}<\u002Fdiv>${foot}${SET.edit&&SET.tab!=='centers'?'<div class=\"set-note\">Itens vazios e duplicados são ignorados ao salvar. Pressione Enter para adicionar uma nova linha.<\u002Fdiv>':''}<\u002Fdiv>`;if(SET.edit)updateDirty()}\nfunction setTab(t){if(t===SET.tab)return;if(setDirty()&&!confirm('Descartar as alterações não salvas?'))return;SET.tab=t;SET.edit=false;SET.draft=null;drawSettings()}\nfunction focusRow(i){const el=$(`.edit-row input[data-i=\"${i}\"]`);if(el)el.focus()}\n$('.settings-nav').addEventListener('click',e=>{const b=e.target.closest('[data-set]');if(b)setTab(b.dataset.set)});\n$('#set-dynamic').addEventListener('click',e=>{const b=e.target.closest('[data-set-act]');if(!b)return;const a=b.dataset.setAct;if(a==='edit'||a==='edit-add'){SET.edit=true;SET.draft=setOriginal();if(a==='edit-add'||(Array.isArray(SET.draft)&&!SET.draft.length))SET.draft.push('');drawSettings();const f=$('#set-dynamic input');if(f)f.focus()}else if(a==='cancel'){if(setDirty()&&!confirm('Descartar as alterações não salvas?'))return;SET.edit=false;SET.draft=null;drawSettings()}else if(a==='add'){SET.draft.push('');drawSettings();focusRow(SET.draft.length-1)}else if(a==='remove'){SET.draft.splice(Number(b.dataset.i),1);drawSettings()}else if(a==='save'){const clean=setClean(SET.draft),def=SETDEF[SET.tab];if(SET.tab==='centers'){db.centers=clean;audit('Centros de custo atualizados','Descrições dos centros M1 a M5 atualizadas')}else{db[def.key]=clean;audit(def.title+' atualizados',clean.length+' opções')}save();SET.edit=false;SET.draft=null;render();toast(def.title+' salvos')}});\n$('#set-dynamic').addEventListener('input',e=>{const t=e.target;if(!SET.edit)return;if(t.dataset.code)SET.draft[t.dataset.code]=t.value;else if(t.dataset.i!=null)SET.draft[Number(t.dataset.i)]=t.value;updateDirty()});\n$('#set-dynamic').addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.dataset&&t.dataset.i!=null){e.preventDefault();const i=Number(t.dataset.i)+1;SET.draft.splice(i,0,'');drawSettings();focusRow(i)}});\nwindow.addEventListener('beforeunload',e=>{if(setDirty()){e.preventDefault();e.returnValue=''}});\n$('#backup-export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'assessoria-mb',version:3,exportedAt:new Date().toISOString(),db},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`assessoria-mb-backup-${todayISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);audit('Backup exportado','Arquivo JSON gerado');toast('Backup exportado')};\n$('#backup-import').onclick=()=>$('#backup-file').click();\n$('#backup-file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());const d=j.db||j;if(!Array.isArray(d.finance)||!Array.isArray(d.tasks))throw 0;if(!confirm(`Substituir os dados atuais por este backup? (${d.finance.length} lançamentos, ${d.tasks.length} tarefas)`))return;db=Object.assign(initial(),{centers:{},banks:[],templates:[],staff:[],historyEdits:{}},d);audit('Backup importado',f.name);save();render();toast('Backup importado')}catch{toast('Arquivo de backup inválido')}};\nrender();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
