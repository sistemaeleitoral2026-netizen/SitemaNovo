const fmt=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const short=d=>d?d.split('-').reverse().join('/'):'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const inPeriod=e=>e.date>=filterFrom&&e.date<=filterTo;const inCompany=e=>!company||e.company===company;const period=()=>entries.filter(e=>inPeriod(e)&&inCompany(e));const companyAudit=()=>audit.filter(inCompany);const companyLabel=()=>{const c=companyById(company);return c?`${esc(c.nome)} · ${esc(c.tipo)}${companyTag(c)}`:'Todas as empresas · visão consolidada'};const sums=arr=>({in:arr.filter(x=>x.type==='entrada').reduce((s,x)=>s+x.value,0),out:arr.filter(x=>x.type==='saida').reduce((s,x)=>s+x.value,0)});const title=(name,desc,tools='')=>`<div class="page-heading"><div><h1>${name}</h1><p class="sub">${desc}</p></div><div class="actions">${tools}</div></div>`;const dateTools=()=>`<input aria-label="Data inicial" title="Data inicial" class="date" type="date" id="from" value="${filterFrom}"><input aria-label="Data final" title="Data final" class="date" type="date" id="to" value="${filterTo}">`;const newBtn=`<button class="btn primary" onclick="showForm()">${ico('plus')} Novo lançamento</button>`;const panel=(heading,content,action='')=>`<section class="panel"><div class="panel-head"><span>${heading}</span>${action}</div>${content}</section>`;
function metric(label,value,note,cls=''){return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value ${cls}">${value}</div><div class="metric-note">${note}</div></div>`}
function thumbs(e){return e.files.length?`<div class="thumbs">${e.files.map((f,i)=>f.url&&f.type!=='application/pdf'?`<img class="thumb" src="${f.url}" alt="${esc(f.name)}" title="${esc(f.name)}" onclick="openFile(${e.id},${i})">`:`<button class="thumb" title="${esc(f.name)}" onclick="openFile(${e.id},${i})">${f.type==='application/pdf'?'PDF':'ARQ'}</button>`).join('')}</div>`:'<span class="muted">Sem anexo</span>'}
function openFile(id,i){const f=entries.find(e=>e.id===id)?.files[i];if(!f?.url)return;if(f.type==='application/pdf')window.open(f.url,'_blank');else{document.getElementById('lightboxImg').src=f.url;document.getElementById('lightbox').classList.remove('hidden')}}

function sheet(a,o={}){if(!a.length)return `<div class="empty">Nenhum lançamento encontrado.</div>`;a=a.slice().sort((x,y)=>y.date.localeCompare(x.date));const cols=[['Data',e=>short(e.date)],...(company?[]:[['Empresa',e=>esc(companyName(e.company))]]),...(o.type?[]:[['Tipo',e=>e.type==='entrada'?'Entrada':'Saída']]),['Descrição',e=>esc(e.desc),'wrap'],['Conta',e=>esc(e.account)],['Forma de pagamento',e=>esc(e.method||'—')],['Valor',e=>`<span class="${e.type==='entrada'?'positive':'negative'}">${fmt(e.value)}</span>`,'num'],['Comprovantes',thumbs],...(o.edit?[['',e=>`<button class="link" onclick="showForm(${e.id})">Editar</button>`]]:[])];const s=sums(a),total=o.type?(o.type==='entrada'?s.in:s.out):s.in-s.out,vi=cols.findIndex(c=>c[0]==='Valor');return `<div class="sheet-hint">Deslize a tabela para o lado para ver todas as colunas</div><div class="sheet-wrap"><table class="sheet"><thead><tr class="cols"><th class="rn"></th>${cols.map((_,i)=>`<th>${String.fromCharCode(65+i)}</th>`).join('')}</tr><tr class="heads"><th class="rn">1</th>${cols.map(c=>`<th class="${c[2]||''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${a.map((e,r)=>`<tr><td class="rn">${r+2}</td>${cols.map(c=>`<td class="${c[2]||''}">${c[1](e)}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr><td class="rn">${a.length+2}</td>${cols.map((c,i)=>`<td class="${c[2]||''}">${i===0?(o.type?'Total':'Saldo'):i===vi?`<span class="${total<0?'negative':o.type==='saida'?'negative':'positive'}">${fmt(total)}</span>`:''}</td>`).join('')}</tr></tfoot></table></div>`}
function renderDashboard(){const a=period(),s=sums(a),missing=a.filter(e=>!e.files.length).length,activity=companyAudit().slice(0,4).map(x=>`<div class="notice"><span class="circle">•</span><div>${esc(x.text)}<small>${esc(x.date)}</small></div></div>`).join('');let chart='';for(let i=0;i<5;i++){let start=new Date(filterFrom+'T12:00:00');start.setDate(start.getDate()+i*7);let end=new Date(start);end.setDate(end.getDate()+6);let items=a.filter(x=>new Date(x.date+'T12:00:00')>=start&&new Date(x.date+'T12:00:00')<=end);const z=sums(items),max=Math.max(1,...Array.from({length:5},(_,j)=>{let st=new Date(filterFrom+'T12:00:00');st.setDate(st.getDate()+j*7);let en=new Date(st);en.setDate(en.getDate()+6);return Math.max(...Object.values(sums(a.filter(x=>new Date(x.date+'T12:00:00')>=st&&new Date(x.date+'T12:00:00')<=en))))}));chart+=`<div class="bar-pair"><div class="bar" title="Entradas: ${fmt(z.in)}" style="height:${Math.max(1,100*z.in/max)}%"></div><div class="bar out" title="Saídas: ${fmt(z.out)}" style="height:${Math.max(1,100*z.out/max)}%"></div></div>`}const accounts=Object.entries(a.filter(x=>x.type==='saida').reduce((map,x)=>(map[x.account]=(map[x.account]||0)+x.value,map),{}));document.getElementById('view').innerHTML=title('Painel Financeiro',companyLabel(),dateTools()+newBtn)+`<div class="metric-grid">${metric('Total que entrou',fmt(s.in),`${a.filter(e=>e.type==='entrada').length} lançamentos de entrada`,'positive')}${metric('Total que saiu',fmt(s.out),`${a.filter(e=>e.type==='saida').length} lançamentos de saída`,'negative')}${metric('Diferença entre entradas e saídas',fmt(s.in-s.out),'Não representa automaticamente a retirada do proprietário')}${metric('Comprovantes cadastrados',a.reduce((n,e)=>n+e.files.length,0),`${missing} lançamentos sem anexo`)}</div><div class="dashboard-row">${panel('Entradas e saídas por semana',`<div class="panel-body"><div class="legend"><span><i class="dot"></i>Entradas</span><span><i class="dot red"></i>Saídas</span></div><div class="bars">${chart}</div><div class="labels">${[1,2,3,4,5].map(x=>`<span>Semana ${x}</span>`).join('')}</div></div>`)}${panel('Resumo do período',`<div class="panel-body"><div class="sumline"><span>Entradas</span><b class="positive">${fmt(s.in)}</b></div><div class="sumline"><span>Saídas</span><b class="negative">${fmt(s.out)}</b></div><div class="sumline"><span>Diferença</span><b>${fmt(s.in-s.out)}</b></div><div class="sumline"><span>Total de lançamentos</span><b>${a.length}</b></div></div>`)}</div><div class="dashboard-row">${panel('Saídas por conta de origem',`<div class="panel-body">${accounts.length?accounts.map(([name,v])=>`<div class="sumline"><span>${esc(name)}</span><b>${fmt(v)}</b></div>`).join(''):'<p class="muted">Nenhuma saída no período.</p>'}</div>`)}${panel('Auditoria e conferência',`<div class="panel-body"><div class="sumline"><span>Sem comprovante</span><b>${missing}</b></div>${activity}</div>`, `<button class="link" onclick="navigate('auditoria')">Ver histórico</button>`)}</div>${company?'':`<div style="margin-top:16px">${panel('Resumo por empresa',`<div class="panel-body">${companies.map(c=>{const z=sums(entries.filter(e=>inPeriod(e)&&e.company===c.id));return `<button class="company-row" onclick="setCompany('${c.id}')"><div class="sumline"><span>${esc(c.nome)}${companyTag(c)}<br><small class="muted">${esc(c.tipo)}</small></span><span>Entrou <b class="positive">${fmt(z.in)}</b> · Saiu <b class="negative">${fmt(z.out)}</b> · Saldo <b>${fmt(z.in-z.out)}</b></span></div></button>`}).join('')}</div>`)}</div>`}<div style="margin-top:16px">${panel('Últimos lançamentos',sheet(a.slice().sort((x,y)=>y.date.localeCompare(x.date)).slice(0,6),{edit:true}),`<button class="link" onclick="navigate('lancamentos')">Ver todos</button>`)}</div><p class="footer-note">Dados demonstrativos. O valor do proprietário depende de uma regra de apuração específica, que ainda não foi definida.</p>`;wireDates()}
function renderList(type){let a=period().filter(e=>!type||e.type===type);const o=type?{type}:{edit:true};document.getElementById('view').innerHTML=title(type==='entrada'?'Entradas':type==='saida'?'Saídas':'Lançamentos',type?'Histórico de '+(type==='entrada'?'entradas':'saídas')+' cadastradas, com os comprovantes anexados.':'Histórico completo de entradas e saídas. Cadastre e edite os lançamentos por aqui.',type?'':newBtn)+`<div class="filters"><input id="search" placeholder="Buscar descrição ou conta bancária" aria-label="Buscar lançamentos">${dateTools()}</div>`+panel(type?'Histórico':'Histórico completo',`<div id="listTable">${sheet(a,o)}</div>`);wireDates();document.querySelector('#search').oninput=()=>{const q=document.querySelector('#search').value.toLowerCase();document.querySelector('#listTable').innerHTML=sheet(a.filter(e=>(e.desc+' '+e.account).toLowerCase().includes(q)),o)}}
function showForm(id){editing=id??null;draftFiles=[];page='form';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page==='lancamentos'));document.querySelector('#topPage').textContent=id?'Editar lançamento':'Novo lançamento';const e=entries.find(x=>x.id===id);document.querySelector('#view').innerHTML=title(id?'Editar lançamento':'Novo lançamento','Cadastre movimentações diretamente no sistema, sem depender de planilhas.',`<button class="btn" onclick="navigate('lancamentos')">Voltar</button>`)+`<div class="form-layout"><section class="panel"><div class="panel-head">Dados do lançamento</div><div class="panel-body"><form id="entryForm"><div class="form-grid"><label class="field full">Empresa<select name="company" required>${(e?.company||company)?'':'<option value="">Selecione a empresa</option>'}${companies.map(c=>`<option value="${c.id}" ${(e?.company||company)===c.id?'selected':''}>${esc(c.nome)} — ${esc(c.tipo)}${c.licitado?' (licitado)':''}</option>`).join('')}</select></label><label class="field">Tipo de lançamento<select name="type" required><option value="entrada" ${e?.type==='entrada'?'selected':''}>Entrada</option><option value="saida" ${e?.type==='saida'?'selected':''}>Saída</option></select></label><label class="field">Data da movimentação<input type="date" name="date" required value="${e?.date||new Date().toLocaleDateString('en-CA')}"></label><label class="field full">Descrição<input maxlength="200" name="desc" required placeholder="Ex.: Pagamento de serviço" value="${esc(e?.desc||'')}"></label><label class="field">Valor (R$)<input name="value" required type="number" min="0.01" step="0.01" placeholder="0,00" value="${e?.value??''}"></label><label class="field">Forma de pagamento<select name="method">${['PIX','Transferência bancária','Dinheiro','Boleto','Outro'].map(m=>`<option ${e?.method===m?'selected':''}>${m}</option>`).join('')}</select></label><label class="field full">Conta bancária de origem / destino<select name function submitForm(ev){ev.preventDefault();const x=Object.fromEntries(new FormData(ev.target).entries());const now=new Date().toLocaleString('pt-BR');const old=entries.find(e=>e.id===editing);const action=old?'Editado por Jurandy Santana':'Criado por Jurandy Santana';const record={id:old?.id||Date.now(),company:x.company,type:x.type,date:x.date,desc:x.desc,value:Number(x.value),account:x.account,method:x.method,notes:x.notes,created:old?.created||'Jurandy Santana',files:[...(old?.files||[]),...draftFiles.map(f=>({name:f.name,size:f.size,type:f.type,url:URL.createObjectURL(f)}))],events:[...(old?.events||[]),{text:action,date:now,company:x.company}]};if(old)entries=entries.map(e=>e.id===old.id?record:e);else entries.unshift(record);audit.unshift({text:`${action} — ${companyName(x.company)} — ${x.desc}`,date:now,company:x.company});if(draftFiles.length)audit.unshift({text:`${draftFiles.length} comprovante(s) anexado(s) por Jurandy Santana`,date:now,company:x.company});navigate('lancamentos')}
function renderAudit(){document.querySelector('#view').innerHTML=title('Auditoria',companyLabel())+panel('Histórico de atividades',`<div class="panel-body">${companyAudit().map(e=>`<div class="notice"><span class="circle">•</span><div>${esc(e.text)}<small>${esc(e.date)}</small></div></div>`).join('')}</div>`)}
function renderFiles(){const rows=entries.filter(inCompany).flatMap(e=>e.files.map(f=>({f,e})));document.querySelector('#view').innerHTML=title('Comprovantes',companyLabel())+panel('Arquivos anexados',rows.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Lançamento</th><th>Arquivo</th><th>Responsável</th></tr></thead><tbody>${rows.map(({e,f})=>`<tr><td>${short(e.date)}</td><td>${esc(e.desc)}</td><td>${esc(f.name)}</td><td>${esc(e.created)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum comprovante anexado. Adicione fotos ou PDFs em um lançamento.</div>`)}
function renderReports(){let s=sums(period());document.querySelector('#view').innerHTML=title('Relatórios',companyLabel(),dateTools()+`<button class="btn" onclick="exportCsv()">${ico('download')} Exportar CSV</button>`)+`<div class="metric-grid">${metric('Entradas',fmt(s.in),'No período selecionado')}${metric('Saídas',fmt(s.out),'No período selecionado')}${metric('Diferença',fmt(s.in-s.out),'Entradas menos saídas')}${metric('Movimentações',period().length,'Registros encontrados')}</div>`+panel('Movimentações',sheet(period()));wireDates()}
function exportCsv(){const header=['Empresa','Data','Tipo','Descrição','Conta','Valor','Forma de pagamento'];const lines=period().map(e=>[companyName(e.company),e.date,e.type,e.desc,e.account,e.value.toFixed(2).replace('.',','),e.method||'']);const csv='\ufeff'+[header,...lines].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='mr-terceiriza-lancamentos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function wireDates(){let a=document.querySelector('#from'),b=document.querySelector('#to');if(a)a.onchange=e=>{filterFrom=e.target.value;render()};if(b)b.onchange=e=>{filterTo=e.target.value;render()}}
function navigate(p){page=p;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.querySelector('#sidebar').classList.remove('open');document.querySelector('#overlay').classList.remove('show');render();window.scrollTo(0,0)}
function render(){const titles={dashboard:'Painel Financeiro',lancamentos:'Lançamentos',entradas:'Entradas',saidas:'Saídas',comprovantes:'Comprovantes',auditoria:'Auditoria',relatorios:'Relatórios',config:'Configurações'};document.querySelector('#topPage').textContent=titles[page]||'Financeiro';if(page==='dashboard')renderDashboard();else if(page==='lancamentos')renderList();else if(page==='entradas')renderList('entrada');else if(page==='saidas')renderList('saida');else if(page==='auditoria')renderAudit();else if(page==='comprovantes')renderFiles();else if(page==='relatorios')renderReports();else document.querySelector('#view').innerHTML=title('Configurações','Definições do ambiente financeiro das empresas.')+panel('Ambiente de demonstração','<div class="panel-body">Esta versão é um protótipo local e não está conectada ao Supabase. Conta de demonstração: Jurandy Santana. Para uso real, será necessário implementar autenticação, banco de dados, Storage e auditoria no servidor.</div>')}
function setCompany(id){company=id;document.querySelector('#company').value=id;if(page==='form')navigate('dashboard');else render()}
document.querySelector('#company').innerHTML='<option value="">Todas as empresas</option>'+companies.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');document.querySelector('#company').onchange=ev=>setCompany(ev.target.value);
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.querySelector('#toggle').onclick=()=>{document.querySelector('#sidebar').classList.add('open');document.querySelector('#overlay').classList.add('show')};document.querySelector('#overlay').onclick=()=>{document.querySelector('#sidebar').classList.remove('open');document.querySelector('#overlay').classList.remove('show')};render();
