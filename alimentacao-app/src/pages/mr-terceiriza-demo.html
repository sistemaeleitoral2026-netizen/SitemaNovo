<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14223a">
<title>Sistema Financeiro</title>
<!--MR_USER-->
<style>
:root{--nav:#14223a;--nav-line:#25344d;--bg:#f3f5f9;--card:#fff;--line:#e6eaf0;--ink:#0f1b2d;--muted:#6b778a;--blue:#2563eb;--blue-soft:#e8f0fe;--green:#16a34a;--green-soft:#e7f6ec;--red:#dc2626;--red-soft:#fdecec;--gray-soft:#eef1f5;--radius:10px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
.hidden{display:none!important}

/* Menu lateral */
.app{display:flex;min-height:100vh}
.sidebar{background:var(--nav);width:212px;flex:none;color:#d9e1ee;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;transition:width .18s}
.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 22px;font-size:16px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.brand svg{width:22px;height:22px;color:#3b82f6}
.navigation{padding:4px 10px;overflow:auto;flex:1}
.nav-btn{width:100%;background:transparent;border:0;color:#d9e1ee;text-align:left;display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:7px;margin:2px 0;white-space:nowrap;font-size:14px}
.nav-btn:hover{background:#1e2f4b}
.nav-btn.active{background:var(--blue);color:#fff}
.nav-btn svg{width:20px;height:20px}
.nav-sep{height:1px;background:var(--nav-line);margin:10px 8px}
.side-bottom{border-top:1px solid var(--nav-line);padding:10px}
.collapse-btn{width:100%;background:none;border:0;color:#d9e1ee;display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:12px;white-space:nowrap;border-radius:7px}
.collapse-btn:hover{background:#1e2f4b}
.collapse-btn svg{width:18px;height:18px}
.side-user{display:none}
.app.collapsed .sidebar{width:72px}
.app.collapsed .nav-label,.app.collapsed .brand span{display:none}
.app.collapsed .collapse-btn svg{transform:rotate(180deg)}
.app.collapsed .nav-btn,.app.collapsed .collapse-btn{justify-content:center}
.app.collapsed .brand{padding:0;justify-content:center}

/* Barra superior */
.content{flex:1;min-width:0}
.topbar{height:58px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px;position:sticky;top:0;z-index:20}
.top-title{display:none;font-size:22px;font-weight:700}
.icon-btn{background:transparent;border:0;padding:8px;border-radius:7px;display:inline-flex;color:#334155}
.icon-btn:hover{background:#f1f4f8}
.icon-btn svg{width:22px;height:22px}
.top-right{display:flex;gap:14px;align-items:center;position:relative}
.user-chip{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px;border-radius:8px;font-size:13px;font-weight:500;color:#1e293b}
.user-chip:hover{background:#f1f4f8}
.user-chip svg{width:16px;height:16px;color:#475569}
.avatar{background:#e4e8ef;color:#1e293b;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.user-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px #0f1b2d1f;min-width:190px;padding:6px;z-index:40}
.user-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:6px;font-size:13px}
.user-menu button:hover{background:#f1f4f8}

/* Conteúdo */
.main{max-width:1600px;padding:20px 24px 28px;margin:0 auto}
.page-heading{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
.page-heading h1{font-size:28px;line-height:1.15;margin:0 0 6px;letter-spacing:-.6px}
.sub{margin:0;color:#475569;font-size:15px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #d5dce6;border-radius:8px;background:#fff;color:#1e293b;padding:10px 15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:hover{filter:brightness(.97)}
.link{background:none;border:none;color:var(--blue);font-weight:500;padding:0;font-size:13px}

.range{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 14px;height:42px;color:#1e293b;font-size:13px;white-space:nowrap}
.range svg{width:18px;height:18px;color:#475569}
.range-part{position:relative;cursor:pointer}
.range-part input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;border:0;padding:0}
.range-chev{background:none;border:0;padding:0;display:inline-flex;margin-left:auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 0;font-weight:700;font-size:15px}
.card-body{padding:14px 16px 16px}

/* Empresas */
.companies{margin-bottom:14px}
.co-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.co-tile{position:relative;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 20px 10px 8px;text-align:left;min-height:94px}
.co-tile:hover{border-color:#bfd0ee}
.co-tile.selected{border-color:var(--blue);background:#f4f8ff;box-shadow:0 0 0 1px var(--blue) inset}
.co-ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none}
.co-ico svg{width:24px;height:24px}
.co-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.co-txt b{font-size:12px;line-height:1.2}
.co-meta{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.co-meta small{font-size:10px;color:#64748b;line-height:1.3}
.co-chev{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:#334155;display:inline-flex}
.co-chev svg{width:16px;height:16px}
.tag-licitado{display:inline-block;font-size:10px;font-weight:600;color:var(--blue);background:var(--blue-soft);border:1px solid #bcd0f6;border-radius:4px;padding:2px 6px;letter-spacing:.2px}
.section-title{display:none}

/* Indicadores */
.metric-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.metric{display:flex;gap:12px;padding:16px 12px;min-height:100px}
.metric-ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none}
.metric-ico svg{width:22px;height:22px}
.mi-green{background:var(--green-soft);color:var(--green)}
.mi-red{background:var(--red-soft);color:var(--red)}
.mi-gray{background:var(--gray-soft);color:#334155}
.mi-blue{background:var(--blue-soft);color:var(--blue)}
.metric>div{min-width:0}.metric-label{color:#1e293b;font-size:12px;font-weight:500}
.metric-value{font-size:clamp(15px,1.4vw,21px);font-weight:700;margin:8px 0 6px;white-space:nowrap;letter-spacing:-.3px}
.metric-note{font-size:11px;color:var(--muted)}
.l-short{display:none}
.metric.only-desktop{display:flex}

.row-2{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr);gap:14px;margin-bottom:14px}
.row-3{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.legend{display:flex;gap:16px;font-size:12px;font-weight:500;color:#334155}
.dot{width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:6px;background:var(--green)}
.dot.red{background:var(--red)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart-empty{position:absolute;inset:0 0 24px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.chart-empty svg{width:34px;height:34px;color:#64748b;margin-bottom:10px}
.chart-empty b{font-size:15px;font-weight:500;margin-bottom:6px}
.chart-empty span{font-size:12px;color:var(--muted);max-width:290px}
.sumline{display:flex;justify-content:space-between;gap:10px;padding:13px 4px;border-bottom:1px solid #eef1f5;font-size:13px}
.sumline:last-child{border:0}
.sumline span{color:#334155}
.sumline b{font-size:15px}
.positive{color:var(--green)}
.negative{color:var(--red)}
.muted{color:var(--muted)}

table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}
.table-wrap{width:100%;overflow:auto}
.tbl th{background:#f6f7f9;color:#334155;font-size:12px;font-weight:500;padding:11px 12px}
.tbl td{font-size:12px;padding:11px 12px;border-bottom:1px solid #eef1f5}
.tbl tr:last-child td{border-bottom:0}
.empty{padding:22px 16px 26px;color:var(--muted);text-align:center;font-size:12px}
.empty svg{width:34px;height:34px;color:#64748b;display:block;margin:6px auto 12px}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:500;margin-bottom:6px}
.type-in{color:var(--green);font-weight:600}
.type-out{color:var(--red);font-weight:600}

/* Formulários e listas */
.filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filters input,.filters select{border:1px solid #d5dce6;background:#fff;padding:10px;border-radius:8px;min-width:160px}
.filters #search{flex:1;min-width:200px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:7px;font-weight:600;color:#334155;font-size:12px}
.field input,.field select,.field textarea{padding:11px 12px;border:1px solid #d5dce6;background:#fff;border-radius:8px;width:100%;font-weight:400;min-height:42px}
.field textarea{min-height:85px;resize:vertical}
.full{grid-column:1/-1}
.form-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:14px}
.upload{border:1px dashed #aebdd0;border-radius:8px;padding:20px;background:#f9fbfd;text-align:center;color:#586a80;cursor:pointer;display:block}
.upload input{display:none}
.upload svg{width:22px;height:22px;display:block;margin:0 auto 6px}
.fileitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eef1f5}
.tag{background:#eef1f5;border-radius:4px;padding:4px 7px;font-size:11px}
.co-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.co-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px}
.co-card:hover{border-color:#bfd0ee}
.co-card-head{display:flex;gap:12px;align-items:center}
.notice{padding:12px 0;border-bottom:1px solid #eef1f5;font-size:13px}
.notice:last-child{border:0}
.inline-form{display:flex;gap:8px;margin-top:12px}
.inline-form input{flex:1;border:1px solid #d5dce6;border-radius:8px;padding:9px 10px;min-width:0}

/* Planilha */
.sheet-wrap{width:100%;overflow:auto;background:#fff}
.sheet{border-collapse:collapse;width:100%;font-family:Calibri,'Segoe UI',Arial,sans-serif;font-size:13px;white-space:nowrap}
.sheet th,.sheet td{border:1px solid #d4d4d4;padding:6px 10px;height:30px}
.sheet .cols th{background:#f3f3f3;color:#666;font-weight:400;text-align:center;font-size:11px;padding:3px;height:22px}
.sheet .heads th{background:#217346;color:#fff;font-weight:600;text-align:left;font-size:12px}
.sheet .rn,.sheet .heads th.rn,.sheet .cols th.rn{background:#f3f3f3;color:#666;text-align:center;width:40px;min-width:40px;font-size:11px;font-weight:400;padding:3px;position:sticky;left:0;z-index:2}
.sheet tbody tr:hover td:not(.rn){background:#e8f2ec}
.sheet .num{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.wrap{white-space:normal;min-width:170px}
.sheet tfoot td{background:#f2f7f4;font-weight:700}
.sheet-hint{display:none;font-size:11px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);text-align:center}
.thumbs{display:flex;gap:5px;align-items:center}
.thumb{width:42px;height:42px;border:1px solid #cfd6df;border-radius:4px;object-fit:cover;cursor:zoom-in;background:#f5f7fa;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--red);padding:0}
.lightbox{position:fixed;inset:0;background:#09121ecc;z-index:60;display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.lightbox-close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:22px;line-height:1}

/* Barra inferior do celular */
.bottom-nav{display:none}
.sidebar-overlay{display:none}

@media(max-width:1100px){.co-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1100px){.metric-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.row-2,.row-3,.form-layout{grid-template-columns:1fr}}

@media(max-width:760px){
  body{background:#f6f7fa}
  .sidebar{position:fixed;left:0;top:0;height:100dvh;width:270px;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .app.collapsed .sidebar{width:270px}
  .app.collapsed .nav-label,.app.collapsed .brand span{display:inline}
  .app.collapsed .nav-btn{justify-content:flex-start}
  .sidebar-overlay.show{display:block;position:fixed;inset:0;background:#09121e88;z-index:25}
  .side-bottom .collapse-btn{display:none}
  .side-user{display:block;padding:6px 4px}
  .side-user-head{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;padding:6px 10px 10px}
  .side-user button{display:block;width:100%;text-align:left;background:none;border:0;color:#d9e1ee;padding:10px;border-radius:7px}
  .side-user button:hover{background:#1e2f4b}
  .topbar{height:auto;padding:calc(14px + env(safe-area-inset-top)) 20px 6px;border:0;background:#f6f7fa}
  .top-left .icon-btn{display:none}
  .top-title{display:block}
  .user-chip,.user-menu{display:none!important}
  .main{padding:6px 16px calc(92px + env(safe-area-inset-bottom))}
  .page-heading{flex-direction:column;align-items:stretch;gap:10px;margin-bottom:16px}
  .page-heading h1,.page-heading .sub{display:none}
  .range{width:100%;padding:0 12px}
  .range-part input{font-size:16px}
  .section-title{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;margin:0 2px 8px}
  .companies{background:none;border:0}
  .companies .card-head{display:none}
  .companies .card-body{padding:0}
  .co-grid{grid-template-columns:1fr;gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .co-tile{border:0;border-bottom:1px solid #eef1f5;border-radius:0;min-height:0;padding:12px 40px 12px 12px;gap:14px}
  .co-tile:last-child{border-bottom:0}
  .co-tile.selected{box-shadow:inset 3px 0 0 var(--blue)}
  .co-ico{width:40px;height:40px}
  .co-txt b{font-size:13px}
  .co-meta{flex-direction:row;align-items:center;gap:12px}
  .co-meta small{font-size:12px}
  .co-chev{right:14px}
  .co-chev svg{width:18px;height:18px}
  .co-grid:not(.expanded) .co-tile.extra{display:none}
  .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .metric{padding:14px 10px;gap:10px;min-height:0}
  .metric.only-desktop{display:none}
  .metric-ico{width:34px;height:34px}
  .metric-ico svg{width:19px;height:19px}
  .metric-value{font-size:16px;margin:6px 0 5px}
  .metric-note{font-size:9px}
  .l-full{display:none}.l-short{display:inline}
  .row-2,.row-3{gap:12px;margin-bottom:12px}
  .row-2 .legend{display:none}
  .chart-empty{inset:0}
  .chart.empty-state svg.axes{opacity:0}
  .chart.empty-state{min-height:150px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters input,.filters select{min-width:0;width:100%;font-size:16px}
  .filters #search,.filters #coFilter{grid-column:1/-1}
  .field input,.field select,.field textarea{font-size:16px}
  .form-grid{grid-template-columns:1fr}
  .sheet-hint{display:block}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .bottom-nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#334155;padding:4px 0}
  .bottom-nav button svg{width:22px;height:22px}
  .bottom-nav button.active{color:var(--blue);font-weight:600}
}
</style>
</head>
<body>
<div class="sidebar-overlay" id="overlay"></div>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="12" width="4.5" height="9" rx="1"/><rect x="9.75" y="7" width="4.5" height="14" rx="1"/><rect x="16.5" y="3" width="4.5" height="18" rx="1"/></svg><span>Sistema Financeiro</span></div>
    <nav class="navigation" id="nav"></nav>
    <div class="side-bottom">
      <div class="side-user" id="sideUser"></div>
      <button class="collapse-btn" id="collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg><span class="nav-label">Recolher menu</span></button>
    </div>
  </aside>
  <div class="content">
    <header class="topbar">
      <div class="top-left"><button class="icon-btn" id="toggle" aria-label="Menu" data-icon="menu"></button><span class="top-title" id="topPage">Painel</span></div>
      <div class="top-right">
        <button class="icon-btn" aria-label="Notificações" data-icon="bell"></button>
        <button class="user-chip" id="userChip"><span class="avatar" id="avatar"></span><span id="userName"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="user-menu hidden" id="userMenu"></div>
      </div>
    </header>
    <main class="main" id="view"></main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<div class="lightbox hidden" id="lightbox" onclick="this.classList.add('hidden')"><button class="lightbox-close" aria-label="Fechar">×</button><img id="lightboxImg" alt=""></div>
<script>
// Protótipo local sem backend. Os dados ficam apenas nesta aba.
const ME=window.MR_USER||{nome:'Jurandy Santana',admin:true};
const initials=n=>{const w=String(n).split(/\s+/).filter(Boolean);return ((w[0]?.[0]||'')+(w.length>1?w[w.length-1][0]:'')).toUpperCase()};
const icons={
  'menu':"<path d='M4 7h16M4 12h16M4 17h16'/>",
  'bell':"<path d='M6 8a6 6 0 1 1 12 0c0 7 3 8.5 3 8.5H3S6 15 6 8'/><path d='M10 20.5a2 2 0 0 0 4 0'/>",
  'home':"<path d='M3 10.5 12 3l9 7.5'/><path d='M5 9v12h14V9'/><path d='M10 21v-6h4v6'/>",
  'list':"<rect x='4' y='3' width='16' height='18' rx='2'/><path d='M8 8h8M8 12h8M8 16h5'/>",
  'arrow-down':"<path d='M12 4v16M6 14l6 6 6-6'/>",
  'arrow-up':"<path d='M12 20V4M6 10l6-6 6 6'/>",
  'file':"<path d='M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z'/><path d='M14 3v5h5M9 13h6M9 17h6M9 9h2'/>",
  'shield':"<path d='M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z'/><path d='m9 12 2 2 4-4'/>",
  'chart':"<path d='M4 20h16'/><path d='M7 20v-8M11 20V5M15 20v-10M19 20v-5'/>",
  'building':"<rect x='5' y='3' width='14' height='18' rx='1'/><path d='M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2M10 21v-3h4v3'/>",

// Gráfico de linhas acumulado no período
function chartSvg(a,empty){
  const W=620,H=210,L=44,R=12,T=10,B=26,days=[];
  for(let d=new Date(filterFrom+'T12:00:00');d<=new Date(filterTo+'T12:00:00');d.setDate(d.getDate()+1))days.push(d.toLocaleDateString('en-CA'));
  if(!days.length)days.push(filterFrom);
  let ci=0,co=0;const pin=[],pout=[];
  days.forEach(day=>{const z=sums(a.filter(x=>x.date===day));ci+=z.in;co+=z.out;pin.push(ci);pout.push(co)});
  const max=empty?1:Math.max(1,ci,co),x=i=>L+(days.length===1?0:i*(W-L-R)/(days.length-1)),y=v=>T+(H-T-B)*(1-v/max);
  const yl=v=>empty?v.toLocaleString('pt-BR',{minimumFractionDigits:1}):v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':Math.round(v);
  let g='';for(let i=0;i<=5;i++){const v=max*i/5;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f5"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#64748b">${yl(v)}</text>`}
  const mes=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],step=Math.max(1,Math.round((days.length-1)/6)),idx=[];
  for(let i=0;i<days.length;i+=step)idx.push(i);if(idx[idx.length-1]!==days.length-1){if(days.length-1-idx[idx.length-1]<step/2)idx.pop();idx.push(days.length-1)}
  idx.forEach(i=>{const [yy,mm,dd]=days[i].split('-');g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#64748b">${dd}/${mes[+mm-1]}</text>`});
  g+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#cbd5e1"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#cbd5e1"/>`;
  if(!empty){const line=(p,c,n)=>`<polyline fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" points="${p.map((v,i)=>x(i)+','+y(v)).join(' ')}"/><circle cx="${x(p.length-1)}" cy="${y(p[p.length-1])}" r="3.5" fill="${c}"><title>${n}: ${fmt(p[p.length-1])}</title></circle>`;g+=line(pout,'#dc2626','Saídas')+line(pin,'#16a34a','Entradas')}
  return `<svg class="axes" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas acumuladas no período">${g}</svg>`;
}

// Tabela no estilo planilha: letras de coluna, números de linha, grade e total no rodapé.
function sheet(a,o={}){if(!a.length)return emptyBox('file','Nenhum lançamento encontrado','Ajuste a empresa ou o período.');a=a.slice().sort((x,y)=>y.date.localeCompare(x.date));const cols=[['Data',e=>short(e.date)],...(company?[]:[['Empresa',e=>esc(companyName(e.company))]]),...(o.type?[]:[['Tipo',e=>e.type==='entrada'?'Entrada':'Saída']]),['Descrição',e=>esc(e.desc),'wrap'],['Conta',e=>esc(e.account)],['Forma de pagamento',e=>esc(e.method||'—')],['Valor',e=>`<span class="${e.type==='entrada'?'positive':'negative'}">${fmt(e.value)}</span>`,'num'],['Comprovantes',thumbs],...(o.edit?[['',e=>`<button class="link" onclick="showForm(${e.id})">Editar</button>`]]:[])];const s=sums(a),total=o.type?(o.type==='entrada'?s.in:s.out):s.in-s.out,vi=cols.findIndex(c=>c[0]==='Valor');return `<div class="sheet-hint">Deslize a tabela para o lado para ver todas as colunas</div><div class="sheet-wrap"><table class="sheet"><thead><tr class="cols"><th class="rn"></th>${cols.map((_,i)=>`<th>${String.fromCharCode(65+i)}</th>`).join('')}</tr><tr class="heads"><th class="rn">1</th>${cols.map(c=>`<th class="${c[2]||''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${a.map((e,r)=>`<tr><td class="rn">${r+2}</td>${cols.map(c=>`<td class="${c[2]||''}">${c[1](e)}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr><td class="rn">${a.length+2}</td>${cols.map((c,i)=>`<td class="${c[2]||''}">${i===0?(o.type?'Total':'Saldo'):i===vi?`<span class="${total<0||o.type==='saida'?'negative':'positive'}">${fmt(total)}</span>`:''}</td>`).join('')}</tr></tfoot></table></div>`}

  +card(type?'Histórico':'Histórico completo',`<div id="listTable">${sheet(a,o)}</div>`);
  wireDates();
  document.getElementById('search').oninput=ev=>{const q=ev.target.value.toLowerCase();document.getElementById('listTable').innerHTML=sheet(a.filter(e=>(e.desc+' '+e.account).toLowerCase().includes(q)),o)};
}

function accountOptions(co,sel){return (accounts[co]||[]).map(n=>`<option ${sel===n?'selected':''}>${esc(n)}</option>`).join('')}
function showForm(id){
  editing=id??null;draftFiles=[];page='form';markNav('lancamentos');
  const e=entries.find(x=>x.id===id),co=e?.company||company;
  document.getElementById('topPage').textContent=id?'Editar lançamento':'Novo lançamento';
  view().innerHTML=title(id?'Editar lançamento':'Novo lançamento','Cadastre movimentações diretamente no sistema, sem depender de planilhas.',`<button class="btn" onclick="navigate('lancamentos')">Voltar</button>`)
  +`<div class="form-layout">${card('Dados do lançamento',`<form id="entryForm"><div class="form-grid">
    <label class="field full">Empresa<select name="company" id="fCompany" required>${co?'':'<option value="">Selecione a empresa</option>'}${companies.map(c=>`<option value="${c.id}" ${co===c.id?'selected':''}>${esc(c.nome)} — ${esc(c.tipo)}${c.licitado?' (licitado)':''}</option>`).join('')}</select></label>
    <label class="field">Tipo de lançamento<select name="type" required><option value="entrada" ${e?.type==='entrada'?'selected':''}>Entrada</option><option value="saida" ${e?.type==='saida'?'selected':''}>Saída</option></select></label>
    <label class="field">Data da movimentação<input type="date" name="date" required value="${e?.date||new Date().toLocaleDateString('en-CA')}"></label>
    <label class="field full">Descrição<input maxlength="200" name="desc" required placeholder="Ex.: Pagamento de serviço" value="${esc(e?.desc||'')}"></label>
    <label class="field">Valor (R$)<input name="value" required type="number" min="0.01" step="0.01" placeholder="0,00" value="${e?.value??''}"></label>
    <label class="field">Forma de pagamento<select name="method">${['PIX','Transferência bancária','Dinheiro','Boleto','Outro'].map(m=>`<option ${e?.method===m?'selected':''}>${m}</option>`).join('')}</select></label>
    <label class="field full">Conta bancária de origem / destino<select name="account" id="fAccount" required>${co?accountOptions(co,e?.account):'<option value="">Escolha a empresa primeiro</option>'}</select></label>
    <label class="field full">Observações<textarea name="notes" placeholder="Informações adicionais">${esc(e?.notes||'')}</textarea></label>
    <div class="field full"><span>Comprovantes (foto ou PDF)</span><label class="upload">${ico('paperclip')}<div>Selecionar imagens ou arquivos PDF</div><small>JPG, PNG ou PDF · até 10 MB por arquivo</small><input id="files" type="file" accept="image/png,image/jpeg,application/pdf" multiple></label><div id="fileList"></div></div>
  </div><div class="actions" style="margin-top:20px"><button type="submit" class="btn primary" id="saveBtn"></button><button type="button" class="btn" onclick="navigate('lancamentos')">Cancelar</button></div></form>`)}<aside>${card('Observação','<div class="muted">Escolha primeiro a empresa: as contas bancárias mostradas são só as dela. As fotos anexadas aparecem ao lado do lançamento nas tabelas de Entradas e Saídas.</div>')}</aside></div>`;
  const fc=document.getElementById('fCompany'),save=document.getElementById('saveBtn');
  const sync=()=>{save.textContent=fc.value?`Salvar na ${companyName(fc.value)}`:'Salvar lançamento'};
  fc.onchange=()=>{document.getElementById('fAccount').innerHTML=fc.value?accountOptions(fc.value):'<option value="">Escolha a empresa primeiro</option>';sync()};sync();
  const files=e?.files||[];document.getElementById('fileList').innerHTML=files.map(f=>`<div class="fileitem">${esc(f.name)} <span class="tag">Anexado</span></div>`).join('');
  document.getElementById('files').onchange=ev=>{draftFiles=Array.from(ev.target.files).filter(f=>f.size<=10*1024*1024&&['image/jpeg','image/png','application/pdf'].includes(f.type));document.getElementById('fileList').innerHTML=files.concat(draftFiles).map(f=>`<div class="fileitem">${esc(f.name)} <span class="tag">${draftFiles.includes(f)?'Novo':'Anexado'}</span></div>`).join('')};
  document.getElementById('entryForm').onsubmit=submitForm;
  window.scrollTo(0,0);
}
function submitForm(ev){
  ev.preventDefault();
  const x=Object.fromEntries(new FormData(ev.target).entries()),now=stamp(),old=entries.find(e=>e.id===editing);
  const record={id:old?.id||Date.now(),company:x.company,type:x.type,date:x.date,desc:x.desc,value:Number(x.value),account:x.account,method:x.method,notes:x.notes,created:old?.created||ME.nome,files:[...(old?.files||[]),...draftFiles.map(f=>({name:f.name,size:f.size,type:f.type,url:URL.createObjectURL(f)}))]};
  if(old)entries=entries.map(e=>e.id===old.id?record:e);else entries.unshift(record);
  audit.unshift({date:now,user:ME.nome,action:old?'Edição':'Criação',desc:x.desc,company:x.company});
  if(draftFiles.length)audit.unshift({date:now,user:ME.nome,action:'Anexo',desc:`${draftFiles.length} comprovante(s) em ${x.desc}`,company:x.company});
  company=x.company;navigate('lancamentos');
}

function renderAudit(){const a=audit.filter(inCompany);view().innerHTML=title('Auditoria',`${companyLabel()} · histórico de registros e alterações.`)+`<div class="filters">${coFilter()}</div>`+card('Histórico de atividades',a.length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Empresa</th><th>Descrição</th></tr></thead><tbody>${a.map(x=>`<tr><td>${short(x.date)} ${x.date.slice(11)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(companyName(x.company))}</td><td>${esc(x.desc)}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('clock','Nenhum registro de auditoria','Ainda não há alterações nesta empresa.'));wireDates()}
function renderFiles(){const rows=entries.filter(inCompany).flatMap(e=>e.files.map(f=>({f,e})));view().innerHTML=title('Comprovantes',`${companyLabel()} · arquivos vinculados aos lançamentos.`)+`<div class="filters">${coFilter()}</div>`+card('Arquivos anexados',rows.length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Empresa</th><th>Lançamento</th><th>Arquivo</th><th>Responsável</th></tr></thead><tbody>${rows.map(({e,f})=>`<tr><td>${short(e.date)}</td><td>${esc(companyName(e.company))}</td><td>${esc(e.desc)}</td><td>${esc(f.name)}</td><td>${esc(e.created)}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('file','Nenhum comprovante anexado','Adicione fotos ou PDFs ao cadastrar um lançamento.'));wireDates()}
function renderReports(){const p=period(),s=sums(p);view().innerHTML=title('Relatórios',`${companyLabel()} · resumo das movimentações no período.`,`<button class="btn" onclick="exportCsv()">${ico('download')} Exportar CSV</button>`)+`<div class="filters">${coFilter()}</div><div class="page-heading" style="margin-bottom:14px"><div></div>${rangeBox()}</div><div class="metric-grid">${metric('arrow-down','mi-green','Total de entradas','Entradas',fmt(s.in),'No período')}${metric('arrow-up','mi-red','Total de saídas','Saídas',fmt(s.out),'No período')}${metric('building','mi-gray','Diferença','Diferença',fmt(s.in-s.out),'Entradas menos saídas')}${metric('list','mi-blue','Movimentações','Movimentações',p.length,'Registros encontrados')}</div>`+(company?'':card('Por empresa',`<div class="table-wrap"><table class="tbl"><thead><tr><th>Empresa</th><th>Entradas</th><th>Saídas</th><th>Diferença</th></tr></thead><tbody>${companies.map(c=>{const z=sums(entries.filter(e=>inPeriod(e)&&e.company===c.id));return `<tr><td><b>${esc(c.nome)}</b> ${tagLicitado(c)}</td><td class="positive">${fmt(z.in)}</td><td class="negative">${fmt(z.out)}</td><td>${fmt(z.in-z.out)}</td></tr>`}).join('')}</tbody></table></div>`)+'<div style="height:14px"></div>')+card('Movimentações',sheet(p));wireDates()}
function exportCsv(){const header=['Empresa','Data','Tipo','Descrição','Conta','Valor','Forma de pagamento'];const lines=period().map(e=>[companyName(e.company),e.date,e.type,e.desc,e.account,e.value.toFixed(2).replace('.',','),e.method||'']);const csv='﻿'+[header,...lines].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='lancamentos-empresas.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderCompanies(){view().innerHTML=title('Empresas','Escolha uma empresa para abrir o painel dela.',rangeBox())+`<div class="co-cards">${companies.map(c=>{const z=sums(entries.filter(e=>inPeriod(e)&&e.company===c.id));return `<button class="co-card" onclick="company='${c.id}';navigate('dashboard')"><div class="co-card-head">${coIcon(c)}<div><b>${esc(c.nome)}</b><div class="co-meta" style="flex-direction:row;align-items:center;gap:8px;margin-top:4px"><small>${esc(c.tipo)}</small>${tagLicitado(c)}</div></div></div><div><div class="sumline"><span>Entradas</span><b class="positive">${fmt(z.in)}</b></div><div class="sumline"><span>Saídas</span><b class="negative">${fmt(z.out)}</b></div><div class="sumline"><span>Diferença</span><b>${fmt(z.in-z.out)}</b></div></div></button>`}).join('')}</div>`;wireDates()}
function renderAccounts(){view().innerHTML=title('Contas bancárias','Contas de cada empresa. No cadastro só aparecem as contas da empresa escolhida.')+`<div class="co-cards">${companies.map(c=>`<section class="co-card"><div class="co-card-head">${coIcon(c)}<b>${esc(c.nome)}</b></div><div>${accounts[c.id].map(n=>`<div class="sumline"><span>${esc(n)}</span><span class="muted">${entries.filter(e=>e.company===c.id&&e.account===n).length} lanç.</span></div>`).join('')}</div><form class="inline-form" onsubmit="addAccount(event,'${c.id}')"><input name="nome" placeholder="Nova conta" required maxlength="60"><button class="btn">${ico('plus')}</button></form></section>`).join('')}</div>`}
function addAccount(ev,id){ev.preventDefault();const n=ev.target.nome.value.trim();if(n&&!accounts[id].includes(n))accounts[id].push(n);renderAccounts()}
function renderUsers(){view().innerHTML=title('Usuários','Quem acessa o sistema e quais empresas cada um vê.')+card('Usuários',`<div class="table-wrap"><table class="tbl"><thead><tr><th>Nome</th><th>Perfil</th><th>Empresas</th></tr></thead><tbody><tr><td>${esc(ME.nome)}</td><td>${ME.admin?'Administrador':'Usuário'}</td><td>${ME.admin?'Todas as empresas':'—'}</td></tr></tbody></table></div><p class="muted" style="font-size:12px;margin:14px 0 0">Na versão com banco de dados, cada funcionário verá apenas a empresa dele; o administrador vê todas.</p>`)}

const navItems=[['dashboard','Painel','home'],['lancamentos','Lançamentos','list'],['entradas','Entradas','arrow-down'],['saidas','Saídas','arrow-up'],'|',['comprovantes','Comprovantes','file'],'|',['auditoria','Auditoria','shield'],['relatorios','Relatórios','chart'],'|',['empresas','Empresas','building'],['contas','Contas bancárias','card'],'|',['usuarios','Usuários','users'],['config','Configurações','settings']];
const titles={dashboard:'Painel',lancamentos:'Lançamentos',entradas:'Entradas',saidas:'Saídas',comprovantes:'Comprovantes',auditoria:'Auditoria',relatorios:'Relatórios',empresas:'Empresas',contas:'Contas bancárias',usuarios:'Usuários',config:'Configurações'};
const bottomItems=[['dashboard','Painel','home'],['lancamentos','Lançamentos','list'],['comprovantes','Comprovantes','file'],['relatorios','Relatórios','chart'],['mais','Mais','dots']];
function markNav(p){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p||(b.dataset.page==='mais'&&!bottomItems.some(i=>i[0]===p))))}
function closeDrawer(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function navigate(p){page=p;closeDrawer();render();window.scrollTo(0,0)}
function render(){
  markNav(page);document.getElementById('topPage').textContent=titles[page]||'Painel';
  ({dashboard:renderDashboard,lancamentos:()=>renderList(),entradas:()=>renderList('entrada'),saidas:()=>renderList('saida'),comprovantes:renderFiles,auditoria:renderAudit,relatorios:renderReports,empresas:renderCompanies,contas:renderAccounts,usuarios:renderUsers}[page]||(()=>{view().innerHTML=title('Configurações','Definições do ambiente financeiro das empresas.')+card('Ambiente de demonstração','<div class="muted">Esta versão é um protótipo local e não está conectada ao banco de dados. Para uso real será necessário salvar lançamentos, comprovantes e auditoria no servidor.</div>')}))();
}
function toParent(type){try{window.parent.postMessage({type},'*')}catch{}}

document.querySelectorAll('[data-icon]').forEach(e=>e.insertAdjacentHTML('afterbegin',ico(e.dataset.icon)));
document.getElementById('nav').innerHTML=navItems.map(i=>i==='|'?'<div class="nav-sep"></div>':`<button class="nav-btn" data-page="${i[0]}" title="${i[1]}">${ico(i[2])}<span class="nav-label">${i[1]}</span></button>`).join('');
document.getElementById('bottomNav').innerHTML=bottomItems.map(i=>`<button data-page="${i[0]}">${ico(i[2])}<span>${i[1]}</span></button>`).join('');
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page==='mais'){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}else navigate(b.dataset.page)});
const userActions=(ME.admin?'<button onclick="toParent(\'mr-nerites\')">Ir para o Sistema Nerites</button>':'')+'<button onclick="toParent(\'mr-sair\')">Sair</button>';
document.getElementById('avatar').textContent=initials(ME.nome);document.getElementById('userName').textContent=ME.nome;
document.getElementById('userMenu').innerHTML=userActions;
document.getElementById('sideUser').innerHTML=`<div class="side-user-head"><span class="avatar">${esc(initials(ME.nome))}</span>${esc(ME.nome)}</div>${userActions}`;
document.getElementById('userChip').onclick=ev=>{ev.stopPropagation();document.getElementById('userMenu').classList.toggle('hidden')};
document.addEventListener('click',()=>document.getElementById('userMenu').classList.add('hidden'));
const toggleCollapse=()=>document.getElementById('app').classList.toggle('collapsed');
document.getElementById('collapse').onclick=toggleCollapse;document.getElementById('toggle').onclick=toggleCollapse;
document.getElementById('overlay').onclick=closeDrawer;
render();
</script>
</body></html>
