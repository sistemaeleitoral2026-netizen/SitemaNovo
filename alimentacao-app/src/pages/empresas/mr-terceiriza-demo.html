<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14223a">
<title>Empresas</title>
<!--MR_USER-->
<style>
:root{--nav:#14223a;--nav-line:#25344d;--bg:#f3f5f9;--card:#fff;--line:#e6eaf0;--ink:#0f1b2d;--muted:#6b778a;--blue:#2563eb;--blue-soft:#e8f0fe;--green:#16a34a;--green-soft:#e7f6ec;--red:#dc2626;--red-soft:#fdecec;--gray-soft:#eef1f5;--radius:10px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
.hidden{display:none!important}

/* Menu lateral */
.app{display:flex;min-height:100vh}
.sidebar{background:var(--nav);width:212px;flex:none;color:#d9e1ee;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;transition:width .18s}
.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 22px;font-size:16px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.brand svg{width:22px;height:22px;color:#3b82f6}
.navigation{padding:4px 10px;overflow:auto;flex:1}
.nav-btn{width:100%;background:transparent;border:0;color:#d9e1ee;text-align:left;display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:7px;margin:2px 0;white-space:nowrap;font-size:14px}
.nav-btn:hover{background:#1e2f4b}
.nav-btn.active{background:var(--blue);color:#fff}
.nav-btn svg{width:20px;height:20px}
.nav-sep{height:1px;background:var(--nav-line);margin:10px 8px}
.side-bottom{border-top:1px solid var(--nav-line);padding:10px}
.collapse-btn{width:100%;background:none;border:0;color:#d9e1ee;display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:12px;white-space:nowrap;border-radius:7px}
.collapse-btn:hover{background:#1e2f4b}
.collapse-btn svg{width:18px;height:18px}
.side-user{display:none}
.app.collapsed .sidebar{width:72px}
.app.collapsed .nav-label,.app.collapsed .brand span{display:none}
.app.collapsed .collapse-btn svg{transform:rotate(180deg)}
.app.collapsed .nav-btn,.app.collapsed .collapse-btn{justify-content:center}
.app.collapsed .brand{padding:0;justify-content:center}

/* Barra superior */
.content{flex:1;min-width:0}
.topbar{height:58px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px;position:sticky;top:0;z-index:20}
.top-title{display:none;font-size:22px;font-weight:700}
.icon-btn{background:transparent;border:0;padding:8px;border-radius:7px;display:inline-flex;color:#334155}
.icon-btn:hover{background:#f1f4f8}
.icon-btn svg{width:22px;height:22px}
.top-right{display:flex;gap:14px;align-items:center;position:relative}
.user-chip{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px;border-radius:8px;font-size:13px;font-weight:500;color:#1e293b}
.user-chip:hover{background:#f1f4f8}
.user-chip svg{width:16px;height:16px;color:#475569}
.avatar{background:#e4e8ef;color:#1e293b;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.user-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px #0f1b2d1f;min-width:190px;padding:6px;z-index:40}
.user-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:6px;font-size:13px}
.user-menu button:hover{background:#f1f4f8}

/* Conteúdo */
.main{max-width:1600px;padding:20px 24px 28px;margin:0 auto}
.page-heading{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
.page-heading h1{font-size:28px;line-height:1.15;margin:0 0 6px;letter-spacing:-.6px}
.sub{margin:0;color:#475569;font-size:15px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #d5dce6;border-radius:8px;background:#fff;color:#1e293b;padding:10px 15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:hover{filter:brightness(.97)}
.link{background:none;border:none;color:var(--blue);font-weight:500;padding:0;font-size:13px}

.range{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 14px;height:42px;color:#1e293b;font-size:13px;white-space:nowrap}
.range svg{width:18px;height:18px;color:#475569}
.range-part{position:relative;cursor:pointer}
.range-part input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;border:0;padding:0}
.range-chev{background:none;border:0;padding:0;display:inline-flex;margin-left:auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 0;font-weight:700;font-size:15px}
.card-body{padding:14px 16px 16px}

/* Empresas */
.companies{margin-bottom:14px}
.co-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.co-tile{position:relative;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 20px 10px 8px;text-align:left;min-height:94px}
.co-tile:hover{border-color:#bfd0ee}
.co-tile.selected{border-color:var(--blue);background:#f4f8ff;box-shadow:0 0 0 1px var(--blue) inset}
.co-ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none}
.co-ico svg{width:24px;height:24px}
.co-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.co-txt b{font-size:12px;line-height:1.2}
.co-meta{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.co-meta small{font-size:10px;color:#64748b;line-height:1.3}
.co-chev{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:#334155;display:inline-flex}
.co-chev svg{width:16px;height:16px}
.tag-licitado{display:inline-block;font-size:10px;font-weight:600;color:var(--blue);background:var(--blue-soft);border:1px solid #bcd0f6;border-radius:4px;padding:2px 6px;letter-spacing:.2px}
.section-title{display:none}

/* Indicadores */
.metric-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.metric{display:flex;gap:12px;padding:16px 12px;min-height:100px}
.metric-ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none}
.metric-ico svg{width:22px;height:22px}
.mi-green{background:var(--green-soft);color:var(--green)}
.mi-red{background:var(--red-soft);color:var(--red)}
.mi-gray{background:var(--gray-soft);color:#334155}
.mi-blue{background:var(--blue-soft);color:var(--blue)}
.metric>div{min-width:0}.metric-label{color:#1e293b;font-size:12px;font-weight:500}
.metric-value{font-size:clamp(15px,1.4vw,21px);font-weight:700;margin:8px 0 6px;white-space:nowrap;letter-spacing:-.3px}
.metric-note{font-size:11px;color:var(--muted)}
.l-short{display:none}
.metric.only-desktop{display:flex}

.row-2{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr);gap:14px;margin-bottom:14px}
.row-3{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.row-2>*,.row-3>*{min-width:0}
.legend{display:flex;gap:16px;font-size:12px;font-weight:500;color:#334155}
.dot{width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:6px;background:var(--green)}
.dot.red{background:var(--red)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart-empty{position:absolute;inset:0 0 24px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.chart-empty svg{width:34px;height:34px;color:#64748b;margin-bottom:10px}
.chart-empty b{font-size:15px;font-weight:500;margin-bottom:6px}
.chart-empty span{font-size:12px;color:var(--muted);max-width:290px}
.sumline{display:flex;justify-content:space-between;gap:10px;padding:13px 4px;border-bottom:1px solid #eef1f5;font-size:13px}
.sumline:last-child{border:0}
.sumline span{color:#334155}
.sumline b{font-size:15px}
.positive{color:var(--green)}
.negative{color:var(--red)}
.muted{color:var(--muted)}

table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}
.table-wrap{width:100%;overflow:auto}
.tbl th{background:#f6f7f9;color:#334155;font-size:12px;font-weight:500;padding:11px 12px}
.tbl td{font-size:12px;padding:11px 12px;border-bottom:1px solid #eef1f5}
.tbl tr:last-child td{border-bottom:0}
.empty{padding:22px 16px 26px;color:var(--muted);text-align:center;font-size:12px}
.empty svg{width:34px;height:34px;color:#64748b;display:block;margin:6px auto 12px}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:500;margin-bottom:6px}
.type-in{color:var(--green);font-weight:600}
.type-out{color:var(--red);font-weight:600}

/* Formulários e listas */
.filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filters input,.filters select{border:1px solid #d5dce6;background:#fff;padding:10px;border-radius:8px;min-width:160px}
.filters #search{flex:1;min-width:200px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:7px;font-weight:600;color:#334155;font-size:12px}
.field input,.field select,.field textarea{padding:11px 12px;border:1px solid #d5dce6;background:#fff;border-radius:8px;width:100%;font-weight:400;min-height:42px}
.field textarea{min-height:85px;resize:vertical}
.full{grid-column:1/-1}
.form-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:14px}
.upload{border:1px dashed #aebdd0;border-radius:8px;padding:20px;background:#f9fbfd;text-align:center;color:#586a80;cursor:pointer;display:block}
.upload input{display:none}
.upload svg{width:22px;height:22px;display:block;margin:0 auto 6px}
.fileitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eef1f5}
.tag{background:#eef1f5;border-radius:4px;padding:4px 7px;font-size:11px}
.co-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.co-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px}
.co-card:hover{border-color:#bfd0ee}
.co-card-head{display:flex;gap:12px;align-items:center}
.notice{padding:12px 0;border-bottom:1px solid #eef1f5;font-size:13px}
.notice:last-child{border:0}
.inline-form{display:flex;gap:8px;margin-top:12px}
.inline-form input{flex:1;border:1px solid #d5dce6;border-radius:8px;padding:9px 10px;min-width:0}

/* Planilha */
.sheet-wrap{width:100%;overflow:auto;background:#fff}
.sheet{border-collapse:collapse;width:100%;font-family:Calibri,'Segoe UI',Arial,sans-serif;font-size:13px;white-space:nowrap}
.sheet th,.sheet td{border:1px solid #d4d4d4;padding:6px 10px;height:30px}
.sheet .cols th{background:#f3f3f3;color:#666;font-weight:400;text-align:center;font-size:11px;padding:3px;height:22px}
.sheet .heads th{background:#217346;color:#fff;font-weight:600;text-align:left;font-size:12px}
.sheet .rn,.sheet .heads th.rn,.sheet .cols th.rn{background:#f3f3f3;color:#666;text-align:center;width:40px;min-width:40px;font-size:11px;font-weight:400;padding:3px;position:sticky;left:0;z-index:2}
.sheet tbody tr:hover td:not(.rn){background:#e8f2ec}
.sheet .num{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.wrap{white-space:normal;min-width:170px}
.sheet tfoot td{background:#f2f7f4;font-weight:700}
.sheet-hint{display:none;font-size:11px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);text-align:center}
.thumbs{display:flex;gap:5px;align-items:center}
.thumb{width:42px;height:42px;border:1px solid #cfd6df;border-radius:4px;object-fit:cover;cursor:zoom-in;background:#f5f7fa;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--red);padding:0}
.lightbox{position:fixed;inset:0;background:#09121ecc;z-index:60;display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.lightbox-close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:22px;line-height:1}

/* Lançamentos */
.mini-label{display:block;font-size:12px;color:#334155;margin-bottom:6px;font-weight:500}
.head-actions{align-items:flex-end;gap:16px;flex-wrap:nowrap;flex:none}
.sel-ico{position:relative;display:block;min-width:250px}
.sel-ico svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#475569;pointer-events:none}
.sel-ico select{width:100%;height:42px;border:1px solid #d5dce6;border-radius:8px;background:#fff;padding:0 10px 0 40px;font-size:13px}
.filters-card{margin-bottom:14px}
.search{position:relative;display:block;margin-bottom:14px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#64748b}
.search input{width:100%;height:42px;border:1px solid #d5dce6;border-radius:8px;padding:0 12px 0 40px;font-size:13px}
.filter-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:14px}
.filter-grid .field,.filter-foot .field{font-weight:500}
.filter-grid select{height:42px;min-height:0;font-size:13px}
.filter-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.filter-foot .range{min-width:250px}
.metric-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.mi-yellow{background:#fef6e0;color:#d97706}
.warn{color:#d97706}
.tbl.lanc th{white-space:normal;vertical-align:bottom}
.tbl.lanc td{vertical-align:middle}
.tbl.lanc th,.tbl.lanc td{padding:9px 7px;font-size:11.5px;border:1px solid #e3e8ef}
.tbl.lanc{border:1px solid #e3e8ef}
.tbl.lanc tbody tr:hover td{background:#f8fafc}
.tbl td.wrap{white-space:normal;min-width:70px;max-width:115px}
.tbl td.desc{min-width:130px;max-width:170px}
.file-link{font-size:12px;text-decoration:underline;text-align:left}
.badge{display:inline-block;padding:4px 8px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.st-ok{background:#e7f6ec;color:#15803d}.st-warn{background:#fef3c7;color:#b45309}.st-bad{background:#fdecec;color:#dc2626}
.row-act{padding:4px}.row-act svg{width:18px;height:18px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px;font-size:12px;flex-wrap:wrap}
.pager-btns{display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:6px 10px;font-size:12px;font-weight:500;gap:4px}
.btn.sm svg{width:14px;height:14px}
.btn.current{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px #0f1b2d1f;min-width:180px;padding:6px;z-index:45}
.pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:6px;font-size:13px}
.pop button:hover{background:#f1f4f8}
.pop .danger{color:var(--red)}

/* Novo lançamento */
.info-banner{display:flex;align-items:center;gap:10px;background:#eef4ff;border:1px solid #c7d7fb;color:#1d4ed8;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.info-banner>svg{width:18px;height:18px}
.info-banner .icon-btn{margin-left:auto;padding:4px;color:#334155}
.info-banner .icon-btn svg{width:16px;height:16px}
.form-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.with-ico{display:flex;align-items:center;gap:10px}
.with-ico svg{width:18px;height:18px;color:var(--blue)}
.fsec .card-head{font-size:14px;padding-bottom:4px}
.fsec .field{font-weight:500}
.req{color:var(--red);font-weight:600}
.notes{width:100%;min-height:72px;border:1px solid #d5dce6;border-radius:8px;padding:11px 12px;resize:vertical;font-size:13px}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px dashed #b6c3d6;border-radius:8px;padding:18px;text-align:center;cursor:pointer;color:#334155;font-size:12px}
.dropzone small{color:var(--muted);font-size:11px}
.dropzone svg{width:26px;height:26px;color:var(--blue)}
.dropzone input{display:none}
.dropzone.over{background:#eef4ff;border-color:var(--blue)}
.file-row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-bottom:1px solid #eef1f5}
.file-row:last-child{border-bottom:0}
.file-thumb{width:34px;height:34px;border-radius:4px;object-fit:cover;background:#f1f4f8;display:grid;place-items:center;flex:none;font-size:9px;font-weight:700;color:#475569}
.file-thumb.pdf{background:#fdecec;color:#dc2626}
.file-info{flex:1;min-width:0}
.file-info b{display:block;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-info small{color:var(--muted);font-size:11px}
.ok-ico{color:var(--green);display:inline-flex}.ok-ico svg{width:20px;height:20px}
.file-row .icon-btn{padding:6px}.file-row .icon-btn svg{width:17px;height:17px}
.field-err{color:var(--red);font-size:12px;margin-top:8px}
.form-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn.outline{border-color:#93b4f4;color:var(--blue)}
.rules .card-body{padding-top:16px}
.rule{display:flex;gap:10px;font-size:12px;color:#334155;margin-bottom:16px;line-height:1.45}
.rule:last-child{margin-bottom:0}
.rule svg{width:18px;height:18px}
.r-red svg{color:var(--red)}.r-blue svg{color:var(--blue)}.r-green svg{color:var(--green)}
.rules .with-ico svg{color:#2563eb}

/* Vendas da loja (Phibo) */
.auto-tag{display:inline-block;font-size:11px;font-weight:600;color:#7c3aed;background:#f3e8ff;border-radius:999px;padding:2px 8px;white-space:nowrap;vertical-align:middle}
.ph-status{display:flex;align-items:center;gap:10px;background:var(--green-soft);color:#14532d;border:1px solid #bbe5c8;border-radius:var(--radius);padding:10px 14px;margin:0 0 14px;font-size:13px}
.ph-status>svg{width:18px;height:18px;flex:none;color:var(--green)}
.ph-status span{flex:1}
.ph-status.warn{background:#fef6e0;border-color:#f6dfa4;color:#7c4a03}.ph-status.warn>svg{color:#d97706}
.ph-status.bad{background:var(--red-soft);border-color:#f5c2c2;color:#7f1d1d}.ph-status.bad>svg{color:var(--red)}
.dot.gray{background:#94a3b8}
.ph-steps{font-size:13px;line-height:1.6;margin:12px 0 8px;padding-left:20px}
.ph-code{display:block;font-size:11px;background:var(--gray-soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0 0 8px;word-break:break-all;user-select:all}

/* Contratos */
.co-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px}
.co-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 18px;font-weight:600;font-size:14px;color:var(--muted);margin-bottom:-1px}
.co-tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
.co-tabs button:hover{color:var(--ink)}
.k-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}
.k-head b{font-size:16px}
.k-card{cursor:pointer}
.k-card .k-title{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.k-card .k-title b{font-size:15px}
.k-card small{color:var(--muted);font-size:12px}
.k-bar{height:7px;background:#eef1f5;border-radius:4px;overflow:hidden}
.k-bar i{display:block;height:100%;background:var(--green)}

.dp-foot{display:flex;justify-content:space-between;margin-top:8px;border-top:1px solid #eef1f5;padding-top:8px}

/* Barra inferior do celular */
.bottom-nav{display:none}
.sidebar-overlay{display:none}

// Gráfico de linhas acumulado no período
function chartSvg(a,empty){
  const W=620,H=210,L=44,R=12,T=10,B=26,days=[];
  for(let d=new Date(filterFrom+'T12:00:00');d<=new Date(filterTo+'T12:00:00');d.setDate(d.getDate()+1))days.push(d.toLocaleDateString('en-CA'));
  if(!days.length)days.push(filterFrom);
  let ci=0,co=0;const pin=[],pout=[];
  days.forEach(day=>{const z=sums(a.filter(x=>x.date===day));ci+=z.in;co+=z.out;pin.push(ci);pout.push(co)});
  const max=empty?1:Math.max(1,ci,co),x=i=>L+(days.length===1?0:i*(W-L-R)/(days.length-1)),y=v=>T+(H-T-B)*(1-v/max);
  const yl=v=>empty?v.toLocaleString('pt-BR',{minimumFractionDigits:1}):v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':Math.round(v);
  let g='';for(let i=0;i<=5;i++){const v=max*i/5;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f5"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#64748b">${yl(v)}</text>`}
  const mes=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],step=Math.max(1,Math.round((days.length-1)/6)),idx=[];
  for(let i=0;i<days.length;i+=step)idx.push(i);if(idx[idx.length-1]!==days.length-1){if(days.length-1-idx[idx.length-1]<step/2)idx.pop();idx.push(days.length-1)}
  idx.forEach(i=>{const [yy,mm,dd]=days[i].split('-');g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#64748b">${dd}/${mes[+mm-1]}</text>`});
  g+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#cbd5e1"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#cbd5e1"/>`;
  if(!empty){const line=(p,c,n)=>`<polyline fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" points="${p.map((v,i)=>x(i)+','+y(v)).join(' ')}"/><circle cx="${x(p.length-1)}" cy="${y(p[p.length-1])}" r="3.5" fill="${c}"><title>${n}: ${fmt(p[p.length-1])}</title></circle>`;g+=line(pout,'#dc2626','Saídas')+line(pin,'#16a34a','Entradas')}
  return `<svg class="axes" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas acumuladas no período">${g}</svg>`;
}

const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const addMonth=(ym,n)=>{const [y,m]=String(ym).split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const ymLabel=ym=>{const [y,m]=String(ym).split('-');return `${MESES[(+m||1)-1]}/${y}`};

function contractStats(k){const a=entries.filter(e=>e.contract===k.id),s=sums(a);return {a,in:s.in,out:s.out,saldo:s.in-s.out,falta:Math.max(0,k.total-s.in),pct:k.total>0?Math.min(100,s.in/k.total*100):0}}
function contractMonths(k){
  const n=Math.max(1,k.months|0),base=Math.floor(k.total/n*100)/100,rows=[];
  for(let i=0;i<n;i++)rows.push({ym:addMonth(k.start,i),prev:i===n-1?Math.round((k.total-base*(n-1))*100)/100:base});
  const a=entries.filter(e=>e.contract===k.id);
  a.forEach(e=>{const ym=e.date.slice(0,7);if(!rows.some(r=>r.ym===ym))rows.push({ym,prev:0})});
  rows.sort((x,y)=>x.ym.localeCompare(y.ym));
  rows.forEach(r=>{const z=sums(a.filter(e=>e.date.slice(0,7)===r.ym));r.in=z.in;r.out=z.out});
  return rows;
}

const PAGE=10,DEFAULT_FROM='2026-10-01',DEFAULT_TO='2026-10-31';
let lf={q:'',type:'',account:'',method:'',page:1},keptFiles=[],tipClosed=false,lancType='';
const LANC_TEXT={'':['Lançamentos','Gerencie todas as entradas e saídas da sua empresa de forma organizada e segura.'],entrada:['Entradas','Histórico de todas as entradas da empresa, com os comprovantes anexados.'],saida:['Saídas','Histórico de todas as saídas da empresa, com os comprovantes anexados.']};
const companySelect=(id,val,withAll)=>`<label class="sel-ico">${ico('building')}<select id="${id}" aria-label="Empresa atual">${withAll?'<option value="">Todas as empresas</option>':(val?'':'<option value="">Selecione a empresa</option>')}${companies.map(c=>opt(c.id,`${c.nome} - ${c.tipo}`,val)).join('')}</select></label>`;
const allAccounts=()=>[...new Set(company?accounts[company]:Object.values(accounts).flat())];

function filtered(){const q=lf.q.trim().toLowerCase();const t=lancType||lf.type;return period().filter(e=>(!t||e.type===t)&&(!lf.account||e.account===lf.account)&&(!lf.method||e.method===lf.method)&&(!q||[e.desc,e.account,companyName(e.company),e.method].join(' ').toLowerCase().includes(q))).sort((x,y)=>y.date.localeCompare(x.date)||String(y.id).localeCompare(String(x.id)))}
function renderLancamentos(type=''){
  lancType=type;const [h,sub]=LANC_TEXT[type];
  view().innerHTML=`<div class="page-heading"><div><h1>${h}</h1><p class="sub">${sub}</p></div><div class="actions head-actions"><div class="current-co"><span class="mini-label">Empresa atual</span>${companySelect('curCo',company,true)}</div><button class="btn primary" onclick="showForm(null,'${type}')">${ico('plus')} ${type==='entrada'?'Nova entrada':type==='saida'?'Nova saída':'Novo lançamento'}</button></div></div>`
  +`<section class="card filters-card"><div class="card-head"><span>Filtros</span></div><div class="card-body">
    <label class="search">${ico('search')}<input id="search" placeholder="Buscar por descrição, conta, empresa..." value="${esc(lf.q)}" aria-label="Buscar"></label>
    <div class="filter-grid">
      <label class="field">Empresa<select id="fEmp"><option value="">Todas as empresas</option>${companies.map(c=>opt(c.id,c.nome,company)).join('')}</select></label>
      <label class="field">Tipo<select id="fTipo" ${type?'disabled':''}>${type?opt(type,type==='entrada'?'Entrada':'Saída',type):opt('','Todos',lf.type)+opt('entrada','Entrada',lf.type)+opt('saida','Saída',lf.type)}</select></label>
      <label class="field">Conta bancária<select id="fConta">${opt('','Todas as contas',lf.account)}${allAccounts().map(a=>opt(a,a,lf.account)).join('')}</select></label>
      <label class="field">Forma de pagamento<select id="fForma">${opt('','Todas',lf.method)}${METHODS.map(m=>opt(m,m,lf.method)).join('')}</select></label>
    </div>
    <div class="filter-foot"><div class="field"><span>Período</span>${rangeBox()}</div><button class="btn" type="button" onclick="clearFilters()">${ico('refresh')} Limpar filtros</button></div>
  </div></section>
  <div id="lancStats"></div>
  <section class="card"><div class="card-head"><span>${h}</span><button class="btn sm" onclick="exportCsv(filtered())">${ico('download')} Exportar</button></div><div class="card-body" id="lancTable"></div></section>`;
  wireDates();
  const on=(id,fn)=>document.getElementById(id).onchange=e=>{fn(e.target.value);lf.page=1;render()};
  on('curCo',v=>{company=v;lf.account=''});on('fEmp',v=>{company=v;lf.account=''});on('fTipo',v=>lf.type=v);on('fConta',v=>lf.account=v);on('fForma',v=>lf.method=v);
  document.getElementById('search').oninput=e=>{lf.q=e.target.value;lf.page=1;updateLanc()};
  updateLanc();
}
function updateLanc(){
  const a=filtered(),s=sums(a),nIn=a.filter(e=>e.type==='entrada').length;
  const pages=Math.max(1,Math.ceil(a.length/PAGE));lf.page=Math.min(lf.page,pages);const start=(lf.page-1)*PAGE,rows=a.slice(start,start+PAGE);
  document.getElementById('lancStats').innerHTML=`<div class="metric-grid">${metric('file','mi-blue','Total de lançamentos','Lançamentos',a.length,'no período selecionado')}${lancType?(lancType==='entrada'?metric('arrow-down','mi-green','Total de entradas','Entradas',`<span class="positive">${fmt(s.in)}</span>`,`${nIn} lançamentos`):metric('arrow-up','mi-red','Total de saídas','Saídas',`<span class="negative">${fmt(s.out)}</span>`,`${a.length-nIn} lançamentos`)):metric('arrow-down','mi-green','Total de entradas','Entradas',`<span class="positive">${fmt(s.in)}</span>`,`${nIn} lançamentos`)+metric('arrow-up','mi-red','Total de saídas','Saídas',`<span class="negative">${fmt(s.out)}</span>`,`${a.length-nIn} lançamentos`)}</div>`;
  document.getElementById('lancTable').innerHTML=a.length?`<div class="table-wrap"><table class="tbl lanc"><thead><tr><th>Data</th><th>Empresa</th>${lancType?'':'<th>Tipo</th>'}<th>Descrição</th><th>Contrato</th><th>Conta de origem/destino</th><th>Forma de pagamento</th><th>Valor</th><th>Comprovante</th><th>Ações</th></tr></thead><tbody>${rows.map(e=>`<tr><td data-label="Data">${short(e.date)}</td><td class="wrap" data-label="Empresa">${esc(companyName(e.company))}</td>${lancType?'':`<td data-label="Tipo" class="${e.type==='entrada'?'type-in':'type-out'}">${e.type==='entrada'?'Entrada':'Saída'}</td>`}<td class="wrap desc c-desc">${esc(e.desc)}${isAuto(e)?' '+autoTag:''}</td><td class="wrap" data-label="Contrato">${e.contract&&contractById(e.contract)?`<button class="link" onclick="openContract('${e.contract}')">${esc(contractName(e.contract))}</button>`:'<span class="muted">—</span>'}</td><td class="wrap" data-label="Conta">${esc(e.account)}</td><td class="wrap" data-label="Pagamento">${esc(e.method)}</td><td data-label="Valor" class="c-valor ${e.type==='entrada'?'positive':'negative'}">${fmt(e.value)}</td><td data-label="Comprovante">${e.files.length?e.files.map((f,i)=>`<button class="link file-link" onclick="openFile('${e.id}',${i})">${esc(f.name)}</button>`).join('<br>'):'<span class="muted">Sem anexo</span>'}</td><td class="c-acoes"><button class="icon-btn row-act" aria-label="Ações" onclick="rowMenu(event,'${e.id}')">${ico('dots')}</button></td></tr>`).join('')}</tbody></table></div><div class="pager"><span class="muted">Mostrando ${start+1} a ${start+rows.length} de ${a.length} lançamentos</span><div class="pager-btns"><button class="btn sm" ${lf.page===1?'disabled':''} onclick="goPage(${lf.page-1})">${ico('chevron-left',2)} Anterior</button>${Array.from({length:pages},(_,i)=>`<button class="btn sm ${i+1===lf.page?'current':''}" onclick="goPage(${i+1})">${i+1}</button>`).join('')}<button class="btn sm" ${lf.page===pages?'disabled':''} onclick="goPage(${lf.page+1})">Próxima ${ico('chevron-right',2)}</button></div></div>`:emptyBox('file','Nenhum lançamento encontrado','Ajuste os filtros ou o período.');
}
function goPage(p){lf.page=p;updateLanc()}
function clearFilters(){lf={q:'',type:'',account:'',method:'',page:1};company='';filterFrom=DEFAULT_FROM;filterTo=DEFAULT_TO;render()}
function hideMenus(){document.getElementById('userMenu').classList.add('hidden');document.getElementById('rowMenu').classList.add('hidden')}
function rowMenu(ev,id){
  ev.stopPropagation();const m=document.getElementById('rowMenu'),e=entries.find(x=>x.id===id),r=ev.currentTarget.getBoundingClientRect();
  m.innerHTML=isAuto(e)?'<button disabled>Lançado automaticamente pelo Phibo</button>':`<button onclick="showForm('${id}')">Editar</button><button class="danger" onclick="removeEntry('${id}')">Excluir</button>`;
  m.classList.remove('hidden');m.style.top=(r.bottom+window.scrollY+4)+'px';m.style.left=Math.max(8,r.right+window.scrollX-m.offsetWidth)+'px';
}
function removeEntry(id){const e=entries.find(x=>x.id===id);hideMenus();if(!e||isAuto(e))return;if(!confirm(`Excluir o lançamento "${e.desc}"?`))return;entries=entries.filter(x=>x.id!==id);audit.unshift({id:crypto.randomUUID(),date:stamp(),user:ME.nome,action:'Exclusão',desc:e.desc,company:e.company});render();scheduleCloudSave()}

const fsec=(icon,head,body)=>`<section class="card fsec"><div class="card-head"><span class="with-ico">${ico(icon)} ${head}</span></div><div class="card-body">${body}</div></section>`;
const req=t=>`<span>${t} <b class="req">*</b></span>`;
function fillAccounts(co,sel){document.getElementById('fAccount').innerHTML='<option value="">Selecione a conta bancária</option>'+(accounts[co]||[]).map(n=>opt(n,n,sel)).join('')}
function fillContracts(co,sel){const wrap=document.getElementById('fContractWrap'),el=document.getElementById('fContract');if(!wrap||!el)return;const list=contracts.filter(k=>k.company===co);wrap.classList.toggle('hidden',!companyById(co)?.licitado&&!list.length);el.innerHTML=opt('','Sem contrato',sel||'')+list.map(k=>opt(k.id,k.name,sel||'')).join('')}
let formBack='lancamentos';
function showForm(id,presetType='',presetContract=''){
  if(id&&isAuto(entries.find(x=>x.id===id))){toast('Lançamento automático do Phibo: é atualizado sozinho e não pode ser editado aqui.');return}
  formBack=page==='form'?formBack:page;if(!['lancamentos','entradas','saidas','contrato'].includes(formBack))formBack='lancamentos';
  editing=id??null;draftFiles=[];page='form';markNav(formBack==='contrato'?'contratos':formBack);hideMenus();
  const e=entries.find(x=>x.id===id),pk=contractById(presetContract),co=e?.company||pk?.company||company;keptFiles=[...(e?.files||[])];
  const kSel=e?(e.contract||''):(pk?.id||'');
  document.getElementById('topPage').textContent=id?'Editar lançamento':'Novo lançamento';
  view().innerHTML=`<div class="page-heading"><div><h1>${id?'Editar lançamento':'Novo lançamento'}</h1><p class="sub">${id?'Altere os dados do lançamento. A alteração fica registrada na auditoria.':'Registre uma nova entrada ou saída no sistema.'}</p></div><div class="actions head-actions"><div class="current-co"><span class="mini-label">Empresa atual</span>${companySelect('curCo',co,false)}</div></div></div>`
  +(tipClosed?'':`<div class="info-banner">${ico('info')}<span>Selecione a empresa para carregar automaticamente as contas bancárias vinculadas.</span><button class="icon-btn" type="button" aria-label="Fechar aviso" onclick="tipClosed=true;this.parentElement.remove()">${ico('x',2)}</button></div>`)
  +`<form id="entryForm" class="form-layout"><div class="form-main">
    ${fsec('list','Dados do lançamento',`<div class="form-grid">
      <label class="field">${req('Empresa')}<select name="company" id="fCompany" required>${co?'':'<option value="">Selecione a empresa</option>'}${companies.map(c=>opt(c.id,`${c.nome} - ${c.tipo}`,co)).join('')}</select></label>
      <label class="field">${req('Tipo do lançamento')}<select name="type" required>${opt('entrada','Entrada',e?.type||presetType||'entrada')}${opt('saida','Saída',e?.type||presetType)}</select></label>
      <label class="field">${req('Data da movimentação')}<input type="date" name="date" required value="${e?.date||new Date().toLocaleDateString('en-CA')}"></label><label class="field" id="fContractWrap">Contrato<select name="contract" id="fContract"></select></label>
      <label class="field full">${req('Descrição')}<input maxlength="200" name="desc" required placeholder="Ex.: Pagamento de serviço, recebimento de cliente..." value="${esc(e?.desc||'')}"></label>
    </div>`)}
    ${fsec('card','Conta e pagamento',`<div class="form-grid">
      <label class="field">${req('Valor (R$)')}<input name="value" required type="number" min="0.01" step="0.01" placeholder="0,00" value="${e?.value??''}"></label>
      <label class="field">${req('Forma de pagamento')}<select name="method" required>${METHODS.map(m=>opt(m,m,e?.method||'PIX')).join('')}</select></label>
      <label class="field full">${req('Conta bancária de origem / destino')}<select name="account" id="fAccount" required></select></label>
    </div>`)}
    ${fsec('list','Observações',`<textarea name="notes" class="notes" aria-label="Observações" placeholder="Informações adicionais sobre o lançamento...">${esc(e?.notes||'')}</textarea>`)}
    ${fsec('paperclip','Comprovantes (foto ou PDF)',`<label class="dropzone" id="drop">${ico('cloud')}<span>Clique para selecionar arquivos ou arraste aqui</span><small>JPG, PNG ou PDF • até 10 MB por arquivo</small><input id="files" type="file" accept="image/png,image/jpeg,application/pdf" multiple></label><div id="fileErr" class="field-err hidden"></div><div id="fileList"></div>`)}
    <div class="form-actions"><button type="submit" class="btn primary" value="save">${ico('save')} Salvar lançamento</button><button type="button" class="btn" onclick="navigate(formBack)">Cancelar</button></div>
  </div><aside><section class="card rules"><div class="card-head"><span class="with-ico">${ico('bulb')} Regras e orientações</span></div><div class="card-body">
    <div class="rule r-blue">${ico('info')}<span>As contas bancárias são filtradas de acordo com a empresa selecionada.</span></div>
    <div class="rule r-green">${ico('shield-ok')}<span>As ações ficam registradas na auditoria do sistema.</span></div>
  </div></section></aside></form>`;
  const fc=document.getElementById('fCompany'),cur=document.getElementById('curCo');
  fillAccounts(co,e?.account);fillContracts(co,kSel);
  fc.onchange=()=>{cur.value=fc.value;fillAccounts(fc.value);fillContracts(fc.value)};
  cur.onchange=()=>{if(fc.querySelector('option[value=""]')&&cur.value)fc.querySelector('option[value=""]').remove();fc.value=cur.value;fillAccounts(cur.value);fillContracts(cur.value)};
  const drop=document.getElementById('drop');
  document.getElementById('files').onchange=ev=>{addFiles(ev.target.files);ev.target.value=''};
  drop.ondragover=ev=>{ev.preventDefault();drop.classList.add('over')};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=ev=>{ev.preventDefault();drop.classList.remove('over');addFiles(ev.dataTransfer.files)};
  renderFileList();
  document.getElementById('entryForm').onsubmit=submitForm;
  window.scrollTo(0,0);
}
function addFiles(list){
  const ok=[],bad=[];
  Array.from(list).forEach(f=>(f.size<=10*1024*1024&&['image/jpeg','image/png','application/pdf'].includes(f.type)?ok:bad).push(f));
  draftFiles.push(...ok.map(f=>{const id=crypto.randomUUID();fileMem[id]=f;return {id,name:f.name,size:f.size,type:f.type,url:URL.createObjectURL(f)}}));
  const err=document.getElementById('fileErr');err.textContent=bad.length?`Não anexado: ${bad.map(f=>f.name).join(', ')}. Use JPG, PNG ou PDF de até 10 MB.`:'';err.classList.toggle('hidden',!bad.length);
  renderFileList();
}
function removeFile(kind,i){(kind==='kept'?keptFiles:draftFiles).splice(i,1);renderFileList()}
function renderFileList(){
  const row=(f,kind,i)=>`<div class="file-row">${f.type==='application/pdf'?'<span class="file-thumb pdf">PDF</span>':f.url?`<img class="file-thumb" src="${f.url}" alt="">`:'<span class="file-thumb">ARQ</span>'}<div class="file-info"><b title="${esc(f.name)}">${esc(f.name)}</b><small>${f.size?fileSize(f.size):''}</small></div><span class="ok-ico" title="Pronto para salvar">${ico('check-circle')}</span><button type="button" class="icon-btn" aria-label="Remover ${esc(f.name)}" onclick="removeFile('${kind}',${i})">${ico('trash')}</button></div>`;
  document.getElementById('fileList').innerHTML=keptFiles.map((f,i)=>row(f,'kept',i)).join('')+draftFiles.map((f,i)=>row(f,'draft',i)).join('');
}
function submitForm(ev){
  ev.preventDefault();
  const x=Object.fromEntries(new FormData(ev.target).entries()),files=[...keptFiles,...draftFiles];
  const now=stamp(),old=entries.find(e=>e.id===editing);
  const kOk=contracts.some(k=>k.id===x.contract&&k.company===x.company);
  const record={id:old?.id||crypto.randomUUID(),company:x.company,type:x.type,date:x.date,desc:x.desc,value:Number(x.value),account:x.account,method:x.method,notes:x.notes,contract:kOk?x.contract:null,created:old?.created||ME.nome,files};
  if(old)entries=entries.map(e=>e.id===old.id?record:e);else entries.unshift(record);
  audit.unshift({id:crypto.randomUUID(),date:now,user:ME.nome,action:old?'Edição':'Criação',desc:x.desc,company:x.company});
  if(draftFiles.length)audit.unshift({id:crypto.randomUUID(),date:now,user:ME.nome,action:'Anexo',desc:`${draftFiles.length} comprovante(s) em ${x.desc}`,company:x.company});
  company=x.company;navigate(formBack);
  scheduleCloudSave();
}

function renderAudit(){const a=audit.filter(inCompany);view().innerHTML=title('Auditoria',`${companyLabel()} · histórico de registros e alterações.`)+`<div class="filters">${coFilter()}</div>`+card('Histórico de atividades',a.length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Empresa</th><th>Descrição</th></tr></thead><tbody>${a.map(x=>`<tr><td>${short(x.date)} ${x.date.slice(11)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(companyName(x.company))}</td><td>${esc(x.desc)}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('clock','Nenhum registro de auditoria',company?'Ainda não há alterações nesta empresa.':'Ainda não há alterações registradas.'));wireDates()}
function renderFiles(){const rows=entries.filter(inCompany).flatMap(e=>e.files.map(f=>({f,e})));view().innerHTML=title('Comprovantes',`${companyLabel()} · arquivos vinculados aos lançamentos.`)+`<div class="filters">${coFilter()}</div>`+card('Arquivos anexados',rows.length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Empresa</th><th>Lançamento</th><th>Arquivo</th><th>Responsável</th></tr></thead><tbody>${rows.map(({e,f})=>`<tr><td>${short(e.date)}</td><td>${esc(companyName(e.company))}</td><td>${esc(e.desc)}</td><td>${esc(f.name)}</td><td>${esc(e.created)}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('file','Nenhum comprovante anexado','Adicione fotos ou PDFs ao cadastrar um lançamento.'));wireDates()}
function renderReports(){const p=period(),s=sums(p);view().innerHTML=title('Relatórios',`${companyLabel()} · resumo das movimentações no período.`,`<button class="btn" onclick="exportCsv()">${ico('download')} Exportar CSV</button>`)+`<div class="filters">${coFilter()}</div><div class="page-heading" style="margin-bottom:14px"><div></div>${rangeBox()}</div><div class="metric-grid">${metric('arrow-down','mi-green','Total de entradas','Entradas',fmt(s.in),'No período')}${metric('arrow-up','mi-red','Total de saídas','Saídas',fmt(s.out),'No período')}${metric('building','mi-gray','Diferença','Diferença',fmt(s.in-s.out),'Entradas menos saídas')}${metric('list','mi-blue','Movimentações','Movimentações',p.length,'Registros encontrados')}</div>`+(company?'':card('Por empresa',`<div class="table-wrap"><table class="tbl"><thead><tr><th>Empresa</th><th>Entradas</th><th>Saídas</th><th>Diferença</th></tr></thead><tbody>${companies.map(c=>{const z=sums(entries.filter(e=>inPeriod(e)&&e.company===c.id));return `<tr><td><b>${esc(c.nome)}</b> ${tagLicitado(c)}</td><td class="positive">${fmt(z.in)}</td><td class="negative">${fmt(z.out)}</td><td>${fmt(z.in-z.out)}</td></tr>`}).join('')}</tbody></table></div>`)+'<div style="height:14px"></div>')+card('Movimentações',sheet(p));wireDates()}
function exportCsv(list=period()){const header=['Empresa','Data','Tipo','Descrição','Conta','Valor','Forma de pagamento'];const lines=list.map(e=>[companyName(e.company),e.date,e.type,e.desc,e.account,e.value.toFixed(2).replace('.',','),e.method||'']);const csv='﻿'+[header,...lines].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='lancamentos-empresas.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderCompanies(){view().innerHTML=title('Empresas','Escolha uma empresa para abrir o painel dela.',rangeBox())+`<div class="co-cards">${companies.map(c=>{const z=sums(entries.filter(e=>inPeriod(e)&&e.company===c.id));return `<button class="co-card" onclick="company='${c.id}';navigate('dashboard')"><div class="co-card-head">${coIcon(c)}<div><b>${esc(c.nome)}</b><div class="co-meta" style="flex-direction:row;align-items:center;gap:8px;margin-top:4px"><small>${esc(c.tipo)}</small>${tagLicitado(c)}</div></div></div><div><div class="sumline"><span>Entradas</span><b class="positive">${fmt(z.in)}</b></div><div class="sumline"><span>Saídas</span><b class="negative">${fmt(z.out)}</b></div><div class="sumline"><span>Diferença</span><b>${fmt(z.in-z.out)}</b></div></div></button>`}).join('')}</div>`;wireDates()}
function renderAccounts(){view().innerHTML=title('Contas bancárias','Contas de cada empresa. No cadastro só aparecem as contas da empresa escolhida.')+`<div class="co-cards">${companies.map(c=>`<section class="co-card"><div class="co-card-head">${coIcon(c)}<b>${esc(c.nome)}</b></div><div>${accounts[c.id].map(n=>`<div class="sumline"><span>${esc(n)}</span><span class="muted">${entries.filter(e=>e.company===c.id&&e.account===n).length} lanç.</span></div>`).join('')}</div><form class="inline-form" onsubmit="addAccount(event,'${c.id}')"><input name="nome" placeholder="Nova conta" required maxlength="60"><button class="btn">${ico('plus')}</button></form></section>`).join('')}</div>`}
function addAccount(ev,id){ev.preventDefault();const n=ev.target.nome.value.trim();if(n&&!accounts[id].includes(n)){accounts[id].push(n);scheduleCloudSave()}renderAccounts()}
let userQ='';
function renderUsers(){
  if(!ME.admin){view().innerHTML=title('Usuários','Empresas liberadas para o seu usuário.')+card('Meu acesso',`<div class="table-wrap"><table class="tbl"><thead><tr><th>Nome</th><th>Empresas liberadas</th></tr></thead><tbody><tr><td>${esc(ME.nome)}</td><td>${companies.length?companies.map(c=>esc(c.nome)).join(', '):'Nenhuma'}</td></tr></tbody></table></div>`);return}
  if(!structOk){view().innerHTML=title('Usuários','Escolha o que cada usuário pode ver e editar.')+card('Falta preparar o banco',emptyBox('settings','Banco ainda não preparado','Rode o arquivo 20261117a_mr_contratos.sql no SQL Editor do Supabase e recarregue esta página.'));return}
  const q=userQ.trim().toLowerCase(),list=users.filter(u=>!q||u.nome.toLowerCase().includes(q));
  const rows=list.map(u=>`<tr><td>${esc(u.nome)}${u.podeAbrir===false?'<br><small class="warn">Sem acesso ao Empresas — libere em Admin do Nerites</small>':''}</td><td>${u.nivel==='admin'?'<b>Administrador</b>':'Editor'}</td>${u.nivel==='admin'?`<td colspan="${ALL_COMPANIES.length}" class="perm-all">Vê e edita todas as empresas</td>`:ALL_COMPANIES.map(c=>`<td><input type="checkbox" aria-label="${esc(u.nome)} — ${esc(c.nome)}" ${(perms[u.id]||[]).includes(c.id)?'checked':''} onchange="togglePerm('${u.id}','${c.id}',this.checked)"></td>`).join('')}</tr>`).join('');
  view().innerHTML=title('Usuários',`Usuários cadastrados no Admin do Nerites (${users.length}). Marque as empresas que cada um pode ver e editar; quem não tiver nenhuma marcada não vê nada.`)
  +`<label class="search">${ico('search')}<input id="userSearch" placeholder="Buscar usuário..." value="${esc(userQ)}" aria-label="Buscar usuário"></label>`
  +card('Permissões por empresa',list.length?`<div class="table-wrap"><table class="tbl perm-tbl"><thead><tr><th>Nome</th><th>Perfil</th>${ALL_COMPANIES.map(c=>`<th>${esc(c.nome)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`:emptyBox('users','Nenhum usuário encontrado',users.length?'Ajuste a busca.':'Nenhum usuário com acesso ao Empresas.'))
  +`<p class="muted" style="font-size:12px;margin:14px 2px 0">Administradores (do Nerites ou com acesso "admin" ao Empresas) veem todas as empresas. A alteração é salva na hora e fica registrada na auditoria.</p>`;
  const s=document.getElementById('userSearch');s.oninput=e=>{userQ=e.target.value;const pos=e.target.selectionStart;renderUsers();const n=document.getElementById('userSearch');n.focus();n.setSelectionRange(pos,pos)};
}
function togglePerm(uid,coId,on){
  if(!ME.admin)return;
  const cur=new Set(perms[uid]||[]);if(on)cur.add(coId);else cur.delete(coId);perms[uid]=[...cur];
  const u=users.find(x=>x.id===uid);
  audit.unshift({id:crypto.randomUUID(),date:stamp(),user:ME.nome,action:on?'Acesso liberado':'Acesso removido',desc:`${u?.nome||'Usuário'} · ${companyName(coId)}`,company:''});
  scheduleCloudSave();
}
function renderConfig(){
  const list=centros.slice().sort((a,b)=>a.localeCompare(b,'pt-BR'));
  view().innerHTML=title('Configurações','Cadastros usados nos contratos e lançamentos.')
  +card('Centros de custo',(list.length?list.map(n=>`<div class="sumline"><span>${esc(n)}</span><span class="muted">${contracts.filter(k=>k.cc===n).length} contrato(s)</span></div>`).join(''):'<div class="muted" style="font-size:13px">Nenhum centro de custo cadastrado ainda.</div>')+`<form class="inline-form" onsubmit="event.preventDefault();addCentro(this.nome.value);"><input name="nome" placeholder="Novo centro de custo" required maxlength="80"><button class="btn">${ico('plus')} Adicionar</button></form>`)
  +(ME.admin?'<div style="height:14px"></div>'+phiboConfigCard():'');
}

// ====== Ponte com o React (Supabase): hidratação e salvamento na nuvem ======
async function blobToB64(blob){const buf=await blob.arrayBuffer();const bytes=new Uint8Array(buf);let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
async function collectPendingFiles(){
  const files={};
  for(const e of entries)for(const f of e.files){
    if(!f||!f.id||f.path)continue;
    const blob=fileMem[f.id];
    if(!blob)continue;
    files[f.id]={name:f.name||'arquivo',type:f.type||blob.type||'application/octet-stream',size:f.size||blob.size||0,dataBase64:await blobToB64(blob)};
  }
  return files;
}
function toServerSnapshot(){
  return {
    lancamentos:entries.map(e=>({id:e.id,empresa:e.company,data:e.date,tipo:e.type,descricao:e.desc,valor:e.value,conta:e.account,formaPagamento:e.method,observacoes:e.notes,contratoId:e.contract||null,origem:e.origem||'',anexos:e.files.map(f=>({id:f.id,name:f.name,type:f.type,size:f.size,path:f.path}))})),
    contas:accounts,
    audit:audit.map(a=>({id:a.id,at:a.date,actor:a.user,action:a.action,detail:a.desc,empresa:a.company})),
    contratos:contracts.map(k=>({id:k.id,empresa:k.company,nome:k.name,valorTotal:k.total,centroCusto:k.cc,inicio:k.start,meses:k.months,observacoes:k.notes,criadoPorId:k.createdById})),
    centrosCusto:centros.slice(),
    ...(ME.admin?{permissoes:perms}:{}),
  };
}
function scheduleCloudSave(){if(!EMBED)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>{cloudTimer=null;void cloudSave()},600)}
async function cloudSave(){
  if(!EMBED)return;
  const requestId='p'+(++cloudReq);
  const snapshot=toServerSnapshot();
  try{snapshot._files=await collectPendingFiles()}catch(err){toast('Falha ao ler comprovantes para nuvem');return}
  cloudPending[requestId]=true;
  try{toParent({type:'mr-persist',requestId,payload:snapshot})}catch(err){delete cloudPending[requestId];toast('Arquivo grande demais para enviar. Use PDF/imagem menor.')}
}
function applyCloudDb(payload){
  if(!payload||typeof payload!=='object')return;
  entries=Array.isArray(payload.lancamentos)?payload.lancamentos.map(l=>({
    id:l.id,company:l.empresa,date:l.data,type:l.tipo,desc:l.descricao||'',value:Number(l.valor)||0,
    account:l.conta||'',method:l.formaPagamento||'',notes:l.observacoes||'',
    contract:l.contratoId||null,origem:l.origem||'',
    created:l.origem==='phibo'?'Phibo (automático)':(l.criadoPor||'—'),
    files:(l.anexos||[]).map(a=>({id:a.id,name:a.name,type:a.type,size:a.size,path:a.path,url:a.signedUrl})),
  })):[];
  if(payload.contas&&typeof payload.contas==='object'){
    ALL_COMPANIES.forEach(c=>{const v=payload.contas[c.id];if(Array.isArray(v)&&v.length)accounts[c.id]=v.slice()});
  }
  audit=Array.isArray(payload.audit)?payload.audit.map(a=>({id:a.id,date:a.at,user:a.actor,action:a.action,desc:a.detail||'',company:a.empresa||''})):[];
  contracts=Array.isArray(payload.contratos)?payload.contratos.map(k=>({id:k.id,company:k.empresa,name:k.nome||'',total:Number(k.valorTotal)||0,cc:k.centroCusto||'',start:k.inicio||thisYm(),months:Math.max(1,Number(k.meses)||1),notes:k.observacoes||'',createdById:k.criadoPorId||''})):[];
  if(Array.isArray(payload.centrosCusto))centros=payload.centrosCusto.slice();
  if(payload.permissoes&&typeof payload.permissoes==='object')perms=JSON.parse(JSON.stringify(payload.permissoes));
  if(Array.isArray(payload.usuarios))users=payload.usuarios.slice();
  structOk=payload.estruturaOk!==false;
  phibo=payload.phibo||null;
  const mine=payload.minhasEmpresas;
  companies=Array.isArray(mine)?ALL_COMPANIES.filter(c=>mine.includes(c.id)):ALL_COMPANIES.slice();
  if(company&&!companies.some(c=>c.id===company))company='';
  if(page==='contrato'&&!contractById(contractId))page='contratos';
  // Não redesenha formulário aberto (apagaria o que está sendo digitado).
  if(page!=='form'&&page!=='contratoForm')render();
}
let toastTimer=null;
function toast(msg){
  let el=document.getElementById('toastBox');
  if(!el){el=document.createElement('div');el.id='toastBox';el.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:90vw;text-align:center;transition:opacity .25s';document.body.appendChild(el)}
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.opacity='0'},3000);
}

// ====== Calendário em português ======
// O seletor nativo de data segue o idioma do navegador (às vezes inglês).
// Cada input date/month vira hidden (mantém name/id/valor ISO e os onchange) +
// um campo de texto dd/mm/aaaa que abre este calendário.
const MESES_LONGOS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const pad2=n=>String(n).padStart(2,'0');
const dpFmt=(v,mode)=>!v?'':mode==='month'?`${v.slice(5,7)}/${v.slice(0,4)}`:v.slice(0,10).split('-').reverse().join('/');
let dpBox=null,dpInput=null,dpY=0,dpM=0,dpMode='date';
function ptDates(root){
  root.querySelectorAll('input[type=date],input[type=month]').forEach(el=>{
    const mode=el.type;el.type='hidden';el.dataset.dp=mode;
    const vis=document.createElement('input');vis.type='text';vis.readOnly=true;vis.className='dp-input';
    vis.placeholder=mode==='month'?'mm/aaaa':'dd/mm/aaaa';vis.value=dpFmt(el.value,mode);
    vis.setAttribute('aria-label',el.getAttribute('aria-label')||(mode==='month'?'Escolher mês':'Escolher data'));
    vis.onclick=()=>dpOpen(el);
    vis.onkeydown=e=>{if(['Enter',' ','ArrowDown'].includes(e.key)){e.preventDefault();dpOpen(el)}else if(e.key==='Escape')dpClose()};
    el.after(vis);el._vis=vis;
  });
}
function dpOpen(input){
  dpInput=input;dpMode=input.dataset.dp==='month'?'month':'date';
  const v=input.value||new Date().toLocaleDateString('en-CA');
  dpY=+v.slice(0,4)||new Date().getFullYear();dpM=Math.min(11,Math.max(0,(+v.slice(5,7)||1)-1));
  if(!dpBox){dpBox=document.createElement('div');dpBox.className='dp hidden';dpBox.setAttribute('role','dialog');dpBox.setAttribute('aria-label','Calendário');dpBox.addEventListener('mousedown',e=>e.preventDefault());document.body.appendChild(dpBox)}
  dpDraw();dpBox.classList.remove('hidden');
  const r=(input._vis||input).getBoundingClientRect(),h=dpBox.offsetHeight,w=dpBox.offsetWidth;
  const top=r.bottom+4+h>window.innerHeight&&r.top-h-4>0?r.top-h-4:r.bottom+4;
  dpBox.style.top=Math.max(4,top)+'px';dpBox.style.left=Math.max(4,Math.min(r.left,window.innerWidth-w-8))+'px';
}
function dpClose(){if(dpBox)dpBox.classList.add('hidden');dpInput=null}
function dpShift(n){if(dpMode==='month')dpY+=n;else{dpM+=n;if(dpM<0){dpM=11;dpY--}if(dpM>11){dpM=0;dpY++}}dpDraw()}
function dpPick(v){
  const el=dpInput;if(!el)return;el.value=v;if(el._vis)el._vis.value=dpFmt(v,dpMode);dpClose();
  el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));
}
function dpDraw(){
  const today=new Date().toLocaleDateString('en-CA'),cur=dpInput?.value||'';let body='',label='';
  if(dpMode==='month'){
    label=String(dpY);
    body=`<div class="dp-grid m">${MESES.map((m,i)=>{const v=`${dpY}-${pad2(i+1)}`;return `<button type="button" class="dp-day ${v===cur?'sel':''} ${v===today.slice(0,7)?'today':''}" onclick="dpPick('${v}')">${m}</button>`}).join('')}</div>`;
  }else{
    label=`${MESES_LONGOS[dpM][0].toUpperCase()+MESES_LONGOS[dpM].slice(1)} de ${dpY}`;
    const start=new Date(dpY,dpM,1-new Date(dpY,dpM,1).getDay());let cells='';
    for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),v=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;cells+=`<button type="button" class="dp-day ${d.getMonth()!==dpM?'out':''} ${v===cur?'sel':''} ${v===today?'today':''}" onclick="dpPick('${v}')" aria-label="${dpFmt(v,'date')}">${d.getDate()}</button>`}
    body=`<div class="dp-grid">${['D','S','T','Q','Q','S','S'].map(w=>`<span class="dp-wd">${w}</span>`).join('')}${cells}</div>`;
  }
  dpBox.innerHTML=`<div class="dp-head"><button type="button" class="dp-nav" onclick="dpShift(-1)" aria-label="Anterior">‹</button><b>${label}</b><button type="button" class="dp-nav" onclick="dpShift(1)" aria-label="Próximo">›</button></div>${body}<div class="dp-foot"><button type="button" class="link" onclick="dpPick('${dpMode==='month'?today.slice(0,7):today}')">${dpMode==='month'?'Este mês':'Hoje'}</button><button type="button" class="link" onclick="dpClose()">Fechar</button></div>`;
}
document.addEventListener('click',e=>{if(dpBox&&!dpBox.contains(e.target)&&!e.target.closest('.dp-input,.range-chev'))dpClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')dpClose()});
window.addEventListener('resize',dpClose);

const navItems=[['dashboard','Painel','home'],['contratos','Contratos','file'],['lancamentos','Lançamentos','list'],['entradas','Entradas','arrow-down'],['saidas','Saídas','arrow-up'],'|',['comprovantes','Comprovantes','file'],'|',['auditoria','Auditoria','shield'],['relatorios','Relatórios','chart'],'|',['empresas','Empresas','building'],['contas','Contas bancárias','card'],'|',['usuarios','Usuários','users'],['config','Configurações','settings']];
const titles={dashboard:'Painel',contratos:'Contratos',contrato:'Contrato',contratoForm:'Contrato',lancamentos:'Lançamentos',entradas:'Entradas',saidas:'Saídas',comprovantes:'Comprovantes',auditoria:'Auditoria',relatorios:'Relatórios',empresas:'Empresas',contas:'Contas bancárias',usuarios:'Usuários',config:'Configurações'};
const bottomItems=[['dashboard','Painel','home'],['lancamentos','Lançamentos','list'],['comprovantes','Comprovantes','file'],['relatorios','Relatórios','chart'],['mais','Mais','dots']];
function markNav(p){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p||(b.dataset.page==='mais'&&!bottomItems.some(i=>i[0]===p))))}
function closeDrawer(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function navigate(p){if(p!==page)lf.page=1;page=p;closeDrawer();render();window.scrollTo(0,0)}
function render(){
  if(page==='contratoForm')page='contratos';
  markNav(page==='contrato'?'contratos':page);document.getElementById('topPage').textContent=titles[page]||'Painel';
  ({dashboard:renderDashboard,contratos:renderContractsPage,contrato:renderContract,lancamentos:()=>renderLancamentos(),entradas:()=>renderLancamentos('entrada'),saidas:()=>renderLancamentos('saida'),comprovantes:renderFiles,auditoria:renderAudit,relatorios:renderReports,empresas:renderCompanies,contas:renderAccounts,usuarios:renderUsers}[page]||renderConfig)();
}
// srcdoc: este documento tem origin opaco ("null"), então postMessage usa '*'
// (conteúdo é gerado pelo próprio React host, não vem de terceiros).
function toParent(msg){if(!EMBED)return;try{window.parent.postMessage(typeof msg==='string'?{type:msg}:msg,'*')}catch{}}

document.querySelectorAll('[data-icon]').forEach(e=>e.insertAdjacentHTML('afterbegin',ico(e.dataset.icon)));
document.getElementById('nav').innerHTML=navItems.map(i=>i==='|'?'<div class="nav-sep"></div>':`<button class="nav-btn" data-page="${i[0]}" title="${i[1]}">${ico(i[2])}<span class="nav-label">${i[1]}</span></button>`).join('');
document.getElementById('bottomNav').innerHTML=bottomItems.map(i=>`<button data-page="${i[0]}">${ico(i[2])}<span>${i[1]}</span></button>`).join('');
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page==='mais'){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}else navigate(b.dataset.page)});
const userActions=(ME.admin?'<button onclick="toParent(\'mr-nerites\')">Ir para o Sistema Nerites</button>':'')+'<button onclick="toParent(\'mr-sair\')">Sair</button>';
document.getElementById('avatar').textContent=initials(ME.nome);document.getElementById('userName').textContent=ME.nome;
document.getElementById('userMenu').innerHTML=userActions;
document.getElementById('sideUser').innerHTML=`<div class="side-user-head"><span class="avatar">${esc(initials(ME.nome))}</span>${esc(ME.nome)}</div>${userActions}`;
document.getElementById('userChip').onclick=ev=>{ev.stopPropagation();document.getElementById('userMenu').classList.toggle('hidden')};
document.addEventListener('click',hideMenus);
const toggleCollapse=()=>document.getElementById('app').classList.toggle('collapsed');
document.getElementById('collapse').onclick=toggleCollapse;document.getElementById('toggle').onclick=toggleCollapse;
document.getElementById('overlay').onclick=closeDrawer;
new MutationObserver(()=>{ptDates(view());if(dpInput&&!dpInput.isConnected)dpClose()}).observe(view(),{childList:true,subtree:true});
render();
window.addEventListener('message',e=>{
  if(e.source!==window.parent)return;
  const d=e.data||{};
  if(d.type==='mr-hydrate'&&d.payload){applyCloudDb(d.payload);return}
  if(d.type==='mr-persist-ok'){delete cloudPending[d.requestId];persistBusyRetries=0;if(d.payload&&!cloudTimer&&!Object.keys(cloudPending).length)applyCloudDb(d.payload);toast('Salvo na nuvem');return}
  if(d.type==='mr-phibo-ok'||d.type==='mr-phibo-erro'){phiboBusy=false;toast(d.msg||(d.type==='mr-phibo-ok'?'Phibo sincronizado':'Falha no Phibo'));if(page!=='form'&&page!=='contratoForm')render();return}
  if(d.type==='mr-persist-erro'){delete cloudPending[d.requestId];const msg=d.erro||'Falha ao salvar na nuvem';if(/em andamento/i.test(msg)&&persistBusyRetries<20){persistBusyRetries++;scheduleCloudSave()}else{persistBusyRetries=0;toast(msg)}return}
});
toParent('mr-pronto');
</script>
